              style={{width:"100%",background:C.surface,border:`1px solid ${C.border}`,borderRadius:8,color:C.text1,fontSize:13,padding:"9px 12px",outline:"none",resize:"vertical",fontFamily:"'DM Sans',sans-serif",boxSizing:"border-box"}}
              onFocus={e=>e.target.style.borderColor=C.accent} onBlur={e=>e.target.style.borderColor=C.border}/>
            <Btn onClick={saveNote} disabled={savingNote} style={{fontSize:11,padding:"5px 12px",marginTop:5}}>{savingNote?"...":"💾 Sauvegarder"}</Btn>
          </div>
          <div style={{fontSize:11,color:C.text3,marginBottom:10,textTransform:"uppercase",letterSpacing:".06em"}}>Historique</div>
          <div style={{maxHeight:400,overflowY:"auto"}}>
            {clientOrders(selected.id).length===0
              ?<div style={{textAlign:"center",padding:20,color:C.text3,fontSize:13}}>Aucune commande</div>
              :clientOrders(selected.id).map(o=><div key={o.id} style={{marginBottom:10,padding:"10px 12px",background:C.surface,borderRadius:8,border:`1px solid ${C.border}`}}>
                <div style={{display:"flex",justifyContent:"space-between",marginBottom:6}}>
                  <span style={{fontFamily:"'JetBrains Mono'",fontSize:11,color:C.accent}}>{o.id}</span>
                  <span style={{fontSize:11,fontWeight:700}}>{fmt(parseFloat(o.total)+parseFloat(o.livraison||0))}</span>
                </div>
                <div style={{fontSize:11,color:C.text3,marginBottom:7}}>{new Date(o.created_at).toLocaleDateString("fr-FR")} · <Badge status={o.status}/></div>
                <div style={{display:"flex",gap:4,flexWrap:"wrap"}}>
                  {Object.entries(STATUS).map(([key,cfg])=><button key={key} onClick={()=>updateStatus(o.id,key)} disabled={updating||o.status===key} style={{padding:"2px 7px",borderRadius:4,fontSize:10,fontWeight:600,cursor:o.status===key?"default":"pointer",border:`1px solid ${o.status===key?cfg.color:C.border}`,background:o.status===key?cfg.bg:"transparent",color:o.status===key?cfg.color:C.text3,fontFamily:"'DM Sans',sans-serif"}}>{cfg.label}</button>)}
                </div>
              </div>)
            }
          </div>
      </div>
      </div>}
    </div>}
  </div>
}

/* ── CATALOG ── */
const EMPTY={name:"",category_id:"",unit:"g",price:"",thc_percent:"",cbd_percent:"",description:"",active:1,medias:[],tiers:[]};

function CatalogPage({products,setProducts,loading,reload}){
  const [filter,setFilter]=useState("tous");
  const [search,setSearch]=useState("");
  const [modal,setModal]=useState(null);
  const [form,setForm]=useState(EMPTY);
  const [saving,setSaving]=useState(false);
  const [toast,setToast]=useState("");
  const [bulkSelected,setBulkSelected]=useState([]);
  const [view,setView]=useState("grid"); // grid | list
  const [categories,setCategories]=useState([]);

  useEffect(()=>{apiGet("/api/categories").then(c=>setCategories(Array.isArray(c)?c:[])).catch(()=>{})},[]);

  const showToast=msg=>{setToast(msg);setTimeout(()=>setToast(""),2500)};
  const setF=patch=>setForm(f=>({...f,...patch}));

  const openNew=()=>{setForm({...EMPTY,category_id:categories[0]?.id||""});setModal("new")};
  const openEdit=p=>{
    const em=[];
    if(p.image_url)em.push({url:p.image_url,type:"image"});
    if(p.video_url)em.push({url:p.video_url,type:"video"});
    const gal=Array.isArray(p.gallery)?p.gallery:(p.gallery?JSON.parse(p.gallery||"[]"):[]);
    gal.forEach(url=>{if(url&&!em.find(m=>m.url===url))em.push({url,type:isVideo(url)?"video":"image"})});
    const tiersArr=Array.isArray(p.tiers)?p.tiers:(p.tiers?JSON.parse(p.tiers||"[]"):[]);
    setForm({name:p.name,category_id:String(p.category_id||""),unit:p.unit||"g",price:String(p.price),thc_percent:String(p.thc_percent||""),cbd_percent:String(p.cbd_percent||""),description:p.description||"",active:p.active??1,medias:em,tiers:tiersArr});
    setModal(p);
  };

  const hasTiers=form.tiers?.length>0;
  const save=async()=>{
    if(!form.name)return;
    if(!hasTiers&&!form.price)return;
    setSaving(true);
    const firstImg=form.medias.find(m=>m.type==="image");
    const firstVid=form.medias.find(m=>m.type==="video");
    const tiersClean=hasTiers?form.tiers.map(t=>({qty:parseFloat(t.qty)||0,price:parseFloat(t.price)||0})).filter(t=>t.qty>0&&t.price>0):null;
    const body={
      category_id:form.category_id?parseInt(form.category_id):null,
      name:form.name,
      description:form.description||null,
      price:form.price?parseFloat(form.price):0,
      unit:form.unit||"g",
      thc_percent:form.thc_percent?parseFloat(form.thc_percent):null,
      cbd_percent:form.cbd_percent?parseFloat(form.cbd_percent):null,
      active:form.active?1:0,
      image_url:firstImg?.url||null,
      video_url:firstVid?.url||null,
      tiers:tiersClean?.length>0?tiersClean:null,
      gallery:form.medias.length>0?JSON.stringify(form.medias.map(m=>m.url)):null,
    };
    try{
      if(modal==="new"){const r=await apiPost("/api/products",body);setProducts(prev=>[...prev,r]);showToast("✅ Produit ajouté !")}
      else{await apiPut("/api/products/"+modal.id,body);setProducts(prev=>prev.map(p=>p.id===modal.id?{...p,...body,id:modal.id}:p));showToast("✅ Modifié !")}
      setModal(null);
    }catch(e){showToast("❌ "+e.message.slice(0,100))}
    setSaving(false);
  };

  const remove=async id=>{if(!confirm("Supprimer ?"))return;try{await apiDelete("/api/products/"+id);setProducts(prev=>prev.filter(p=>p.id!==id));showToast("🗑️ Supprimé")}catch(e){showToast("❌ "+e.message.slice(0,100))}};

  const duplicate=async p=>{
    const body={category_id:p.category_id||null,name:`${p.name} (copie)`,description:p.description||null,price:p.price,unit:p.unit||"g",thc_percent:p.thc_percent||null,cbd_percent:p.cbd_percent||null,active:1};
    try{const r=await apiPost("/api/products",body);setProducts(prev=>[...prev,r]);showToast("✅ Dupliqué")}catch(e){showToast("❌ "+e.message.slice(0,100))}
  };

  const bulkToggleActive=async(active)=>{
    for(const id of bulkSelected){
      const p=products.find(x=>x.id===id);
      if(p)try{await apiPut("/api/products/"+id,{...p,active});setProducts(prev=>prev.map(x=>x.id===id?{...x,active}:x))}catch(e){}
    }
    setBulkSelected([]);showToast(`✅ ${bulkSelected.length} produits mis à jour`);
  };

  const filtered=useMemo(()=>{
    let r=products;
    if(filter!=="tous")r=r.filter(p=>String(p.category_id)===filter||p.category_name===filter);
    if(search)r=r.filter(p=>p.name.toLowerCase().includes(search.toLowerCase()));
    return r;
  },[products,filter,search]);

  return<div className="fade-in" style={{display:"flex",flexDirection:"column",gap:16,position:"relative"}}>
    <Toast msg={toast}/>

    <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",flexWrap:"wrap",gap:10}}>
      <div style={{fontFamily:"'Bebas Neue'",fontSize:34,letterSpacing:"0.05em"}}>Catalogue</div>
      <div style={{display:"flex",gap:8}}>
        <button onClick={()=>setView(v=>v==="grid"?"list":"grid")} style={{background:C.surface,border:`1px solid ${C.border}`,borderRadius:8,color:C.text2,cursor:"pointer",padding:"7px 12px",fontSize:13}}>{view==="grid"?"☰ Liste":"⊞ Grille"}</button>
        <Btn variant="ghost" onClick={reload} style={{fontSize:12}}>🔄</Btn>
        <Btn onClick={openNew}>+ Produit</Btn>
      </div>
    </div>

    <div style={{display:"flex",flexDirection:"column",gap:8}}>
      <input value={search} onChange={e=>setSearch(e.target.value)} placeholder="Rechercher..." style={{width:"100%",boxSizing:"border-box",background:C.card,border:`1px solid ${C.border}`,borderRadius:8,color:C.text1,fontSize:13,padding:"9px 12px",outline:"none"}} onFocus={e=>e.target.style.borderColor=C.accent} onBlur={e=>e.target.style.borderColor=C.border}/>
      <div style={{display:"flex",gap:6,overflowX:"auto",paddingBottom:2,WebkitOverflowScrolling:"touch"}}>
        {[{v:"tous",l:"Tous"},...categories.map(c=>({v:String(c.id),l:`${c.emoji||""} ${c.name}`}))].map(c=><button key={c.v} onClick={()=>setFilter(c.v)} style={{padding:"6px 14px",borderRadius:7,fontSize:12,fontWeight:600,cursor:"pointer",whiteSpace:"nowrap",flexShrink:0,background:filter===c.v?C.accent:"transparent",color:filter===c.v?C.bg:C.text2,border:`1px solid ${filter===c.v?C.accent:C.border}`,fontFamily:"'DM Sans',sans-serif"}}>{c.l}</button>)}
        <span style={{marginLeft:"auto",fontSize:12,color:C.text3,whiteSpace:"nowrap",alignSelf:"center",flexShrink:0}}>{filtered.length} produit{filtered.length>1?"s":""}</span>
      </div>
    </div>

    {/* Bulk actions */}
    {bulkSelected.length>0&&<div style={{padding:"10px 14px",background:C.accentDim,border:`1px solid ${C.accentMid}`,borderRadius:9,display:"flex",alignItems:"center",gap:10,flexWrap:"wrap"}}>
      <span style={{fontSize:13,color:C.accent,fontWeight:600}}>{bulkSelected.length} sélectionné{bulkSelected.length>1?"s":""}</span>
      <Btn variant="green" style={{padding:"4px 10px",fontSize:11}} onClick={()=>bulkToggleActive(1)}>✅ Activer</Btn>
      <Btn variant="danger" style={{padding:"4px 10px",fontSize:11}} onClick={()=>bulkToggleActive(0)}>❌ Désactiver</Btn>
      <button onClick={()=>setBulkSelected([])} style={{marginLeft:"auto",background:"none",border:"none",color:C.text3,cursor:"pointer",fontSize:14}}>×</button>
    </div>}

    {loading?<div style={{padding:60,display:"flex",justifyContent:"center"}}><div className="spinner"/></div>:

    view==="list"?(
      <Card style={{padding:0,overflow:"hidden"}}>
        <table style={{width:"100%",borderCollapse:"collapse"}}>
          <thead><tr style={{borderBottom:`1px solid ${C.border}`,background:C.surface}}>
            <th style={{padding:"10px 14px",width:32}}><input type="checkbox" onChange={e=>setBulkSelected(e.target.checked?filtered.map(p=>p.id):[])}/></th>
            {["Produit","Catégorie","Prix","Statut","Actions"].map(h=><th key={h} style={{padding:"10px 14px",textAlign:"left",fontSize:10,color:C.text3,fontWeight:700,letterSpacing:"0.08em",textTransform:"uppercase"}}>{h}</th>)}
          </tr></thead>
          <tbody>
            {filtered.map((p,i)=>{
              const mainImg=p.image_url;
              return<tr key={p.id} style={{borderBottom:i<filtered.length-1?`1px solid ${C.border}`:"none"}} className="row-hover">
                <td style={{padding:"10px 14px"}}><input type="checkbox" checked={bulkSelected.includes(p.id)} onChange={e=>{e.stopPropagation();setBulkSelected(prev=>e.target.checked?[...prev,p.id]:prev.filter(x=>x!==p.id))}}/></td>
                <td style={{padding:"10px 14px"}}>
                  <div style={{display:"flex",alignItems:"center",gap:10}}>
                    <div style={{width:40,height:40,borderRadius:8,background:C.surface,flexShrink:0,overflow:"hidden",display:"flex",alignItems:"center",justifyContent:"center"}}>
                      {mainImg?<img src={mainImg} style={{width:"100%",height:"100%",objectFit:"cover"}} alt=""/>:<span style={{fontSize:20}}>{p.category_emoji||"📦"}</span>}
                    </div>
                    <div>
                      <div style={{fontSize:13,fontWeight:600}}>{p.name}</div>
                      {(p.thc_percent||p.cbd_percent)&&<div style={{fontSize:11,color:C.text3}}>{p.thc_percent?`THC ${p.thc_percent}%`:""}{p.thc_percent&&p.cbd_percent?" · ":""}{p.cbd_percent?`CBD ${p.cbd_percent}%`:""}</div>}
                    </div>
                  </div>
                </td>
                <td style={{padding:"10px 14px",fontSize:12,color:C.text2}}>{p.category_emoji||""} {p.category_name||"—"}</td>
                <td style={{padding:"10px 14px"}}>
                  <div style={{fontSize:13,fontWeight:700,color:C.accent}}>{fmt(p.price)}</div>
                  <div style={{fontSize:11,color:C.text3}}>{p.unit}</div>
                </td>
                <td style={{padding:"10px 14px"}}><span style={{fontSize:10,padding:"2px 7px",borderRadius:4,background:p.active?"#00e67618":"#ff475718",color:p.active?C.green:C.red,border:"1px solid currentColor",fontWeight:700}}>{p.active?"ACTIF":"INACTIF"}</span></td>
                <td style={{padding:"10px 14px"}}>
                  <div style={{display:"flex",gap:6}}>
                    <Btn variant="ghost" style={{padding:"4px 10px",fontSize:11}} onClick={()=>openEdit(p)}>✏️</Btn>
                    <Btn variant="ghost" style={{padding:"4px 8px",fontSize:11}} title="Dupliquer" onClick={()=>duplicate(p)}>⧉</Btn>
                    <Btn variant="danger" style={{padding:"4px 8px",fontSize:11}} onClick={()=>remove(p.id)}>🗑</Btn>
                  </div>
                </td>
              </tr>
            })}
          </tbody>
        </table>
      </Card>
    ):(
      <div className="catalog-grid">
        {filtered.map(p=>{
          const mainImg=p.image_url;const mainVid=p.video_url;
          return<Card key={p.id} style={{padding:0,overflow:"hidden",cursor:"pointer"}} onClick={()=>openEdit(p)}>
            <div style={{height:130,background:C.surface,position:"relative",overflow:"hidden",display:"flex",alignItems:"center",justifyContent:"center"}}>
              {mainVid?<video src={mainVid} style={{width:"100%",height:"100%",objectFit:"cover"}} autoPlay muted loop playsInline/>
               :mainImg?<img src={mainImg} style={{width:"100%",height:"100%",objectFit:"cover"}} alt=""/>
               :<span style={{fontSize:40}}>{p.category_emoji||"📦"}</span>}
              {!p.active&&<span style={{position:"absolute",top:6,right:6,background:"#ff475788",color:"#fff",fontSize:9,fontWeight:700,padding:"2px 6px",borderRadius:3}}>INACTIF</span>}
              <input type="checkbox" checked={bulkSelected.includes(p.id)} onChange={e=>{e.stopPropagation();setBulkSelected(prev=>e.target.checked?[...prev,p.id]:prev.filter(x=>x!==p.id))}} onClick={e=>e.stopPropagation()} style={{position:"absolute",bottom:6,right:6,width:16,height:16,cursor:"pointer"}}/>
            </div>
            <div style={{padding:12}}>
              <div style={{fontSize:10,color:C.text3,letterSpacing:".06em",marginBottom:2}}>{p.category_emoji||""} {p.category_name||"Sans catégorie"}</div>
              <div style={{fontSize:13,fontWeight:600,marginBottom:4,lineHeight:1.3}}>{p.name}</div>
              <div style={{display:"flex",alignItems:"center",gap:6,marginBottom:6,flexWrap:"wrap"}}>
                {parseFloat(p.price)>0
                  ?<><span style={{fontFamily:"'Bebas Neue'",fontSize:18,color:C.accent}}>{fmt(p.price)}</span><span style={{fontSize:11,color:C.text3}}>{p.unit}</span></>
                  :(()=>{const t=Array.isArray(p.tiers)?p.tiers:(p.tiers?JSON.parse(p.tiers||"[]"):[]);return t.length>0
                    ?t.map((tier,i)=><span key={i} style={{fontSize:11,color:C.accent,background:C.accentDim,border:`1px solid ${C.accentMid}`,borderRadius:4,padding:"2px 6px"}}>{tier.qty}g·{tier.price}€</span>)
                    :<span style={{fontFamily:"'Bebas Neue'",fontSize:18,color:C.accent}}>{fmt(p.price)}</span>;
                  })()
                }
              </div>
              {(p.thc_percent||p.cbd_percent)&&<div style={{display:"flex",alignItems:"center"}}>
                <span style={{fontSize:10,color:C.accent}}>{p.thc_percent?`THC ${p.thc_percent}%`:""}{p.thc_percent&&p.cbd_percent?" ":""}{p.cbd_percent?`CBD ${p.cbd_percent}%`:""}</span>
              </div>}
              <div style={{display:"flex",gap:6,marginTop:8}} onClick={e=>e.stopPropagation()}>
                <Btn variant="ghost" style={{flex:1,justifyContent:"center",padding:"5px",fontSize:11}} onClick={()=>openEdit(p)}>✏️</Btn>
                <Btn variant="ghost" style={{padding:"5px 8px",fontSize:11}} title="Dupliquer" onClick={()=>duplicate(p)}>⧉</Btn>
                <Btn variant="danger" style={{padding:"5px 8px",fontSize:11}} onClick={()=>remove(p.id)}>🗑</Btn>
              </div>
            </div>
          </Card>
        })}
      </div>
    )}

    {/* MODAL PRODUIT */}
    {modal&&<div style={{position:"fixed",inset:0,background:"#000000cc",display:"flex",alignItems:"flex-start",justifyContent:"center",zIndex:500,overflowY:"auto",padding:"20px 0 40px"}} onClick={()=>setModal(null)}>
      <div className="scale-in modal-inner" style={{background:C.card,border:`1px solid ${C.border}`,borderRadius:"16px",width:"100%",maxWidth:600,maxHeight:"90vh",overflowY:"auto"}} onClick={e=>e.stopPropagation()}>
        <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:20}}>
          <div style={{fontFamily:"'Bebas Neue'",fontSize:22,letterSpacing:"0.05em"}}>{modal==="new"?"Nouveau produit":"Modifier : "+form.name}</div>
          <button onClick={()=>setModal(null)} style={{background:"none",border:"none",color:C.text3,cursor:"pointer",fontSize:20}}>×</button>
        </div>
        <div style={{display:"flex",flexDirection:"column",gap:16}}>
          <Inp label="Nom" value={form.name} onChange={v=>setF({name:v})} placeholder="Ex: Wedding Cake" required/>
          <div className="form-grid-2">
            <Sel label="Catégorie" value={String(form.category_id)} onChange={v=>setF({category_id:v})} options={[{value:"",label:"— Aucune —"},...categories.map(c=>({value:String(c.id),label:`${c.emoji||""} ${c.name}`}))]}/>
            <Sel label="Actif" value={String(form.active)} onChange={v=>setF({active:parseInt(v)})} options={[{value:"1",label:"✅ Actif"},{value:"0",label:"❌ Inactif"}]}/>
          </div>
          <div>
            <div style={{fontSize:11,fontWeight:700,textTransform:"uppercase",letterSpacing:"0.08em",color:C.text3,marginBottom:6}}>Description</div>
            <textarea value={form.description} onChange={e=>setF({description:e.target.value})}
              placeholder="Description du produit (optionnel)..."
              rows={3}
              style={{width:"100%",background:C.surface,border:`1px solid ${C.border}`,borderRadius:10,color:C.text1,fontSize:13,padding:"10px 13px",outline:"none",fontFamily:"'DM Sans',sans-serif",resize:"vertical",boxSizing:"border-box"}}
              onFocus={e=>e.target.style.borderColor=C.accent}
              onBlur={e=>e.target.style.borderColor=C.border}/>
          </div>
          <Inp label={hasTiers?"Prix (€) — optionnel si paliers":"Prix (€)"} type="number" value={form.price} onChange={v=>setF({price:v})} required={!hasTiers} min="0" note={hasTiers?"Laissez vide si uniquement des paliers":"Prix de vente"}/>
          <div className="form-grid-3">
            <Inp label="Unité" value={form.unit} onChange={v=>setF({unit:v})} placeholder="g"/>
            <Inp label="THC (%)" type="number" value={form.thc_percent} onChange={v=>setF({thc_percent:v})} min="0" max="100"/>
            <Inp label="CBD (%)" type="number" value={form.cbd_percent} onChange={v=>setF({cbd_percent:v})} min="0" max="100"/>
          </div>
          {form.unit==="g"&&<div style={{borderTop:`1px solid ${C.border}`,paddingTop:14}}>
            <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:10}}>
              <div style={{fontSize:11,fontWeight:700,textTransform:"uppercase",letterSpacing:"0.08em",color:C.text3}}>Paliers de quantité (g → prix €)</div>
              <button onClick={()=>setF({tiers:[...form.tiers,{qty:"",price:""}]})} style={{background:C.accentDim,border:`1px solid ${C.accentMid}`,borderRadius:6,color:C.accent,cursor:"pointer",fontSize:11,padding:"3px 10px",fontFamily:"'DM Sans',sans-serif"}}>+ Ajouter</button>
            </div>
            {form.tiers.length===0&&<div style={{fontSize:12,color:C.text3,fontStyle:"italic"}}>Aucun palier — prix unitaire utilisé par défaut</div>}
            {form.tiers.map((t,i)=><div key={i} style={{display:"flex",gap:8,alignItems:"center",marginBottom:6}}>
              <input type="number" value={t.qty} min="0" placeholder="Qté (g)" onChange={e=>{const ts=[...form.tiers];ts[i]={...ts[i],qty:e.target.value};setF({tiers:ts})}} style={{flex:1,background:C.surface,border:`1px solid ${C.border}`,borderRadius:7,color:C.text1,fontSize:12,padding:"6px 10px",outline:"none",fontFamily:"'DM Sans',sans-serif"}}/>
              <span style={{fontSize:12,color:C.text3}}>g →</span>
              <input type="number" value={t.price} min="0" step="0.01" placeholder="Prix (€)" onChange={e=>{const ts=[...form.tiers];ts[i]={...ts[i],price:e.target.value};setF({tiers:ts})}} style={{flex:1,background:C.surface,border:`1px solid ${C.border}`,borderRadius:7,color:C.text1,fontSize:12,padding:"6px 10px",outline:"none",fontFamily:"'DM Sans',sans-serif"}}/>
              <span style={{fontSize:12,color:C.text3}}>€</span>
              <button onClick={()=>setF({tiers:form.tiers.filter((_,j)=>j!==i)})} style={{background:"none",border:"none",color:C.red,cursor:"pointer",fontSize:16,lineHeight:1,padding:"0 4px"}}>×</button>
            </div>)}
          </div>}
          <div style={{borderTop:`1px solid ${C.border}`,paddingTop:16}}><GalerieEditor medias={form.medias} onChange={medias=>setF({medias})}/></div>
        </div>
        <div style={{display:"flex",gap:10,marginTop:20,justifyContent:"flex-end"}}>
          <Btn variant="ghost" onClick={()=>setModal(null)}>Annuler</Btn>
          <Btn onClick={save} disabled={saving||!form.name||(!hasTiers&&!form.price)}>{saving?"Sauvegarde...":modal==="new"?"✅ Créer":"✅ Enregistrer"}</Btn>
        </div>
      </div>
    </div>}
  </div>
}

/* ── CATEGORIES ── */
function CategoriesPage(){
  const [cats,setCats]=useState([]);
  const [loading,setLoading]=useState(false);
  const [saving,setSaving]=useState(false);
  const [toast,setToast]=useState("");
  const [editId,setEditId]=useState(null);
  const [form,setForm]=useState({name:"",emoji:"🌿",sort_order:"",active:1});
  const [showNew,setShowNew]=useState(false);

  const showToast=msg=>{setToast(msg);setTimeout(()=>setToast(""),2500)};

  const load=()=>{setLoading(true);apiGet("/api/categories").then(d=>setCats(Array.isArray(d)?d:[])).catch(e=>showToast("Erreur: "+e.message)).finally(()=>setLoading(false))};
  useEffect(()=>{load()},[]);

  const startEdit=c=>{setEditId(c.id);setForm({name:c.name,emoji:c.emoji||"🌿",sort_order:String(c.sort_order||0),active:c.active??1});setShowNew(false)};
  const startNew=()=>{setEditId(null);setForm({name:"",emoji:"🌿",sort_order:"",active:1});setShowNew(true)};
  const cancel=()=>{setEditId(null);setShowNew(false)};

  const save=async()=>{
    if(!form.name.trim())return;
    setSaving(true);
    try{
      if(editId){
        await apiPut("/api/categories/"+editId,{name:form.name.trim(),emoji:form.emoji||"🌿",active:form.active?1:0,sort_order:parseInt(form.sort_order)||0});
        setCats(prev=>prev.map(c=>c.id===editId?{...c,...form,sort_order:parseInt(form.sort_order)||0}:c));
        setEditId(null);
      } else {
        const res=await apiPost("/api/categories",{name:form.name.trim(),emoji:form.emoji||"🌿",sort_order:parseInt(form.sort_order)||0});
        setCats(prev=>[...prev,{...res,active:1}]);
        setShowNew(false);
      }
      showToast("✓ Sauvegardé");
    }catch(e){showToast("Erreur: "+e.message);}
    setSaving(false);
  };

  const del=async(id,name)=>{
    if(!confirm(`Supprimer définitivement "${name}" et tous ses produits ?`))return;
    try{await apiDelete("/api/categories/"+id);setCats(prev=>prev.filter(c=>c.id!==id));showToast("✓ Supprimée")}catch(e){showToast("Erreur: "+e.message)}
  };

  const formJsx=<div style={{display:"flex",flexDirection:"column",gap:10,padding:"16px",background:C.surface,borderRadius:10,border:`1px solid ${C.border}`,marginBottom:10}}>
    <div className="form-grid-cat" style={{display:"grid",gridTemplateColumns:"60px 1fr 80px",gap:8}}>
      <input value={form.emoji} onChange={e=>setForm(f=>({...f,emoji:e.target.value}))} placeholder="🌿" style={{background:C.card,border:`1px solid ${C.border}`,borderRadius:8,color:C.text1,fontSize:22,padding:"7px",outline:"none",textAlign:"center"}} onFocus={e=>e.target.style.borderColor=C.accent} onBlur={e=>e.target.style.borderColor=C.border}/>
      <input value={form.name} onChange={e=>setForm(f=>({...f,name:e.target.value}))} placeholder="Nom de la catégorie" onKeyDown={e=>e.key==="Enter"&&save()} style={{background:C.card,border:`1px solid ${C.border}`,borderRadius:8,color:C.text1,fontSize:14,padding:"8px 12px",outline:"none"}} onFocus={e=>e.target.style.borderColor=C.accent} onBlur={e=>e.target.style.borderColor=C.border}/>
      <input type="number" value={form.sort_order} onChange={e=>setForm(f=>({...f,sort_order:e.target.value}))} placeholder="Ordre" style={{background:C.card,border:`1px solid ${C.border}`,borderRadius:8,color:C.text1,fontSize:14,padding:"8px 10px",outline:"none"}} onFocus={e=>e.target.style.borderColor=C.accent} onBlur={e=>e.target.style.borderColor=C.border}/>
    </div>
    <div style={{display:"flex",gap:8,alignItems:"center"}}>
      <label style={{fontSize:12,color:C.text2,display:"flex",alignItems:"center",gap:6,cursor:"pointer"}}>
        <input type="checkbox" checked={form.active===1||form.active===true} onChange={e=>setForm(f=>({...f,active:e.target.checked?1:0}))} style={{cursor:"pointer"}}/>
        Active
      </label>
      <div style={{flex:1}}/>
      <Btn variant="ghost" onClick={cancel} style={{fontSize:12,padding:"6px 12px"}}>Annuler</Btn>
      <Btn onClick={save} disabled={saving||!form.name.trim()} style={{fontSize:12,padding:"6px 14px"}}>{saving?"...":"✓ Sauvegarder"}</Btn>
    </div>
  </div>;

  return<div className="fade-in" style={{maxWidth:620}}>
    <Toast msg={toast}/>
    <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:20}}>
      <div>
        <div style={{fontFamily:"'Bebas Neue'",fontSize:34,letterSpacing:"0.05em"}}>Catégories</div>
        <div style={{fontSize:12,color:C.text3,marginTop:2}}>{cats.length} catégorie{cats.length>1?"s":""}</div>
      </div>
      <Btn onClick={startNew} style={{fontSize:13}}>+ Nouvelle</Btn>
    </div>

    {showNew&&formJsx}

    {loading?<div style={{padding:40,display:"flex",justifyContent:"center"}}><div className="spinner"/></div>:
    <div style={{display:"flex",flexDirection:"column",gap:8}}>
      {cats.map(c=>{
        const isEditing=editId===c.id;
        return<div key={c.id}>
          {isEditing&&formJsx}
          {!isEditing&&<div style={{display:"flex",alignItems:"center",gap:12,padding:"13px 16px",background:C.card,border:`1px solid ${C.border}`,borderRadius:10}}>
            <span style={{fontSize:22,width:30,textAlign:"center",flexShrink:0}}>{c.emoji||"🌿"}</span>
            <div style={{flex:1}}>
              <div style={{fontSize:14,fontWeight:600,color:C.text1}}>{c.name}</div>
              <div style={{fontSize:11,color:C.text3}}>Ordre #{c.sort_order||0}</div>
            </div>
            <div style={{display:"flex",gap:6}}>
              <Btn variant="ghost" onClick={()=>startEdit(c)} style={{fontSize:11,padding:"4px 10px"}}>Modifier</Btn>
              <Btn variant="danger" onClick={()=>del(c.id,c.name)} style={{fontSize:11,padding:"4px 10px"}}>🗑 Supprimer</Btn>
            </div>
          </div>}
        </div>
      })}
      {cats.length===0&&<div style={{padding:40,textAlign:"center",color:C.text3,fontSize:13}}>Aucune catégorie</div>}
    </div>}
  </div>
}

/* ── PROMOS ── */
function PromosPage(){
  const [promos,setPromos]=useState([]);
  const [loading,setLoading]=useState(false);
  const [toast,setToast]=useState("");
  const [form,setForm]=useState({code:"",discount_type:"percent",discount_value:"",min_order:"",max_uses:""});
  const [showNew,setShowNew]=useState(false);
  const showToast=msg=>{setToast(msg);setTimeout(()=>setToast(""),2500)};
  const load=()=>{setLoading(true);apiGet("/api/promos").then(d=>setPromos(Array.isArray(d)?d:[])).catch(e=>showToast("Erreur: "+e.message)).finally(()=>setLoading(false))};
  useEffect(()=>{load()},[]);

  const create=async()=>{
    if(!form.code.trim()||!form.discount_value)return showToast("Code et valeur requis");
    try{
      await apiPost("/api/promos",{code:form.code,discount_type:form.discount_type,discount_value:parseFloat(form.discount_value),min_order:parseFloat(form.min_order||0),max_uses:parseInt(form.max_uses||0)});
      setForm({code:"",discount_type:"percent",discount_value:"",min_order:"",max_uses:""});
      setShowNew(false);
      load();
      showToast("✅ Code créé !");
    }catch(e){showToast("Erreur: "+e.message)}
  };
  const toggle=async(p)=>{
    await apiPatch("/api/promos/"+p.id,{active:p.active?0:1}).catch(e=>showToast("Erreur: "+e.message));
    setPromos(prev=>prev.map(x=>x.id===p.id?{...x,active:p.active?0:1}:x));
  };
  const del=async(id)=>{
    if(!confirm("Supprimer ce code ?"))return;
    await apiDelete("/api/promos/"+id).catch(e=>showToast("Erreur: "+e.message));
    setPromos(prev=>prev.filter(x=>x.id!==id));
  };

  const inputStyle={background:C.surface,border:`1px solid ${C.border}`,borderRadius:8,color:C.text1,fontSize:13,padding:"8px 10px",outline:"none",width:"100%",fontFamily:"inherit"};
  const selStyle={...inputStyle,cursor:"pointer"};

  const newFormJsx=<div style={{background:C.card,border:`1px solid ${C.border}`,borderRadius:10,padding:16,display:"flex",flexDirection:"column",gap:10,marginBottom:12}}>
    <div style={{fontWeight:700,fontSize:13,color:C.text1,marginBottom:4}}>Nouveau code promo</div>
    <div className="form-grid-promo">
      <div>
        <div style={{fontSize:11,color:C.text3,marginBottom:4,textTransform:"uppercase",letterSpacing:"0.06em"}}>Code *</div>
        <input style={{...inputStyle,textTransform:"uppercase"}} placeholder="PROMO10" value={form.code} onChange={e=>setForm(f=>({...f,code:e.target.value.toUpperCase()}))}/>
      </div>
      <div>
        <div style={{fontSize:11,color:C.text3,marginBottom:4,textTransform:"uppercase",letterSpacing:"0.06em"}}>Type</div>
        <select style={selStyle} value={form.discount_type} onChange={e=>setForm(f=>({...f,discount_type:e.target.value}))}>
          <option value="percent">% Pourcentage</option>
          <option value="fixed">€ Montant fixe</option>
        </select>
      </div>
      <div>
        <div style={{fontSize:11,color:C.text3,marginBottom:4,textTransform:"uppercase",letterSpacing:"0.06em"}}>Valeur * {form.discount_type==="percent"?"%":"€"}</div>
        <input style={inputStyle} type="number" min="0" placeholder={form.discount_type==="percent"?"10":"5"} value={form.discount_value} onChange={e=>setForm(f=>({...f,discount_value:e.target.value}))}/>
      </div>
      <div>
        <div style={{fontSize:11,color:C.text3,marginBottom:4,textTransform:"uppercase",letterSpacing:"0.06em"}}>Commande min (€)</div>
        <input style={inputStyle} type="number" min="0" placeholder="0" value={form.min_order} onChange={e=>setForm(f=>({...f,min_order:e.target.value}))}/>
      </div>
      <div>
        <div style={{fontSize:11,color:C.text3,marginBottom:4,textTransform:"uppercase",letterSpacing:"0.06em"}}>Utilisations max (0=∞)</div>
        <input style={inputStyle} type="number" min="0" placeholder="0" value={form.max_uses} onChange={e=>setForm(f=>({...f,max_uses:e.target.value}))}/>
      </div>
    </div>
    <div style={{display:"flex",gap:8,justifyContent:"flex-end"}}>
      <Btn variant="ghost" onClick={()=>setShowNew(false)} style={{fontSize:12,padding:"6px 14px"}}>Annuler</Btn>
      <Btn variant="primary" onClick={create} style={{fontSize:12,padding:"6px 14px"}}>✓ Créer</Btn>
    </div>
  </div>;

  return <div style={{padding:"0 16px 24px"}}>
    {toast&&<div style={{position:"fixed",bottom:20,left:"50%",transform:"translateX(-50%)",background:C.card,border:`1px solid ${C.border}`,borderRadius:20,padding:"8px 20px",fontSize:13,fontWeight:600,zIndex:999}}>{toast}</div>}
    <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"20px 0 14px"}}>
      <div>
        <div style={{fontSize:18,fontWeight:800,color:C.text1}}>Codes Promo</div>
        <div style={{fontSize:12,color:C.text3,marginTop:2}}>{promos.length} code{promos.length!==1?"s":""} au total</div>
      </div>
      {!showNew&&<Btn variant="primary" onClick={()=>setShowNew(true)} style={{fontSize:12,padding:"8px 14px"}}>+ Nouveau</Btn>}
    </div>
    {showNew&&newFormJsx}
    {loading?<div style={{textAlign:"center",padding:40,color:C.text3}}>Chargement...</div>:<div style={{display:"flex",flexDirection:"column",gap:8}}>
      {promos.map(p=>{
        const discLabel=p.discount_type==="percent"?`-${p.discount_value}%`:`-${parseFloat(p.discount_value).toFixed(2)}€`;
        const usageLabel=p.max_uses>0?`${p.uses_count}/${p.max_uses} utilisations`:`${p.uses_count} utilisation${p.uses_count!==1?"s":""}`;
        const minLabel=p.min_order>0?` · Min ${parseFloat(p.min_order).toFixed(0)}€`:"";
        return <div key={p.id} style={{background:C.card,border:`1px solid ${p.active?C.border:"#ff475730"}`,borderRadius:10,padding:"12px 14px",display:"flex",alignItems:"center",gap:12,opacity:p.active?1:.65}}>
          <div style={{flex:1}}>
            <div style={{display:"flex",alignItems:"center",gap:8,flexWrap:"wrap"}}>
              <span style={{fontFamily:"monospace",fontWeight:800,fontSize:14,color:C.text1,letterSpacing:"0.05em"}}>{p.code}</span>
              <span style={{background:"rgba(0,230,118,.12)",color:"#00e676",borderRadius:20,padding:"2px 10px",fontSize:12,fontWeight:700}}>{discLabel}</span>
              {!p.active&&<span style={{background:"rgba(255,71,87,.1)",color:"#ff4757",borderRadius:20,padding:"2px 8px",fontSize:11}}>Inactif</span>}
            </div>
            <div style={{fontSize:11,color:C.text3,marginTop:4}}>{usageLabel}{minLabel}</div>
          </div>
          <div style={{display:"flex",gap:6}}>
            <Btn variant="ghost" onClick={()=>toggle(p)} style={{fontSize:11,padding:"4px 10px"}}>{p.active?"Désactiver":"Activer"}</Btn>
            <Btn variant="danger" onClick={()=>del(p.id)} style={{fontSize:11,padding:"4px 10px"}}>✕</Btn>
          </div>
        </div>;
      })}
      {promos.length===0&&!loading&&<div style={{padding:40,textAlign:"center",color:C.text3,fontSize:13}}>Aucun code promo — créez-en un !</div>}
    </div>}
  </div>;
}

/* ── MESSAGES ── */
// Module-level cache: survives page navigation (component remounts)
let _convCache=[];
let _bcastCache=[];

function MessagesPage({onRead,onGoToOrder,orders=[],setOrders,getSettings}){
  // conversations = sidebar list from /api/messages (one entry per user with unread_count)
  // chatMessages  = individual messages for selected user from /api/messages/:id
  const [conversations,setConversations]=useState(_convCache);
  const [chatMessages,setChatMessages]=useState([]);
  const [selected,setSelected]=useState(null);
  const [loading,setLoading]=useState(false);
  const [reply,setReply]=useState("");
  const [sending,setSending]=useState(false);
  const [broadcast,setBroadcast]=useState("");
  const [broadcasting,setBroadcasting]=useState(false);
  const [broadcastHistory,setBroadcastHistory]=useState(_bcastCache);
  const [tab,setTab]=useState("inbox");
  const [toast,setToast]=useState("");
  const [showOrders,setShowOrders]=useState(false);
  const [updatingO,setUpdatingO]=useState(false);
  const [searchConv,setSearchConv]=useState("");
  const messagesEndRef=useRef(null);
  const selectedRef=useRef(null);
  selectedRef.current=selected;

  const showToast=msg=>{setToast(msg);setTimeout(()=>setToast(""),2500)};
  const dn=u=>u.username?`@${u.username}`:`${u.first_name||""}${u.last_name?` ${u.last_name}`:""}`.trim()||`User ${u.id}`;

  // Fetch sidebar conversations (does NOT touch chatMessages)
  // Conversations and broadcasts are fetched INDEPENDENTLY — one failure doesn't block the other
  const fetchConversations=async(silent=false)=>{
    if(!silent)setLoading(true);
    try{
      const convs=await apiGet("/api/messages");
      if(Array.isArray(convs)){_convCache=convs;setConversations(convs);}
    }catch(e){if(!silent)console.error("conversations:",e)}
    try{
      const bh=await apiGet("/api/broadcasts");
      if(Array.isArray(bh)){_bcastCache=bh;setBroadcastHistory(bh);}
    }catch(e){if(!silent)console.error("broadcasts:",e)}
    if(!silent)setLoading(false);
  };

  // Fetch individual messages for selected user
  const fetchChatMessages=async(userId)=>{
    try{
      const msgs=await apiGet("/api/messages/"+userId);
      setChatMessages(msgs.map(m=>({...m,direction:m.from_admin?"out":"in"})));
    }catch(e){console.error(e)}
  };

  // Mark read in DB and update local unread_count to 0
  const markRead=async(userId)=>{
    try{
      await apiPost("/api/messages/read/"+userId,{});
      setConversations(prev=>prev.map(c=>c.id===userId?{...c,unread_count:0}:c));
      if(onRead)onRead();
    }catch(e){}
  };

  const filteredConvs=useMemo(()=>{
    const sorted=[...conversations].sort((a,b)=>new Date(b.last_message_time)-new Date(a.last_message_time));
    if(!searchConv)return sorted;
    const q=searchConv.toLowerCase();
    return sorted.filter(c=>{
      const name=c.username?`@${c.username}`:`${c.first_name||""} ${c.last_name||""}`.trim();
      return name.toLowerCase().includes(q)||String(c.telegram_id).includes(q);
    });
  },[conversations,searchConv]);

  // Initial load
  useEffect(()=>{fetchConversations()},[]);

  // Poll every 3s: refresh conversations + current chat independently
  useEffect(()=>{
    const t=setInterval(async()=>{
      fetchConversations(true); // fire and forget — don't block chat refresh
      if(selectedRef.current)fetchChatMessages(selectedRef.current.id);
    },3000);
    return()=>clearInterval(t);
  },[]);

  // When selecting a user: load messages + mark read
  useEffect(()=>{
    if(!selected){setChatMessages([]);return;}
    fetchChatMessages(selected.id);
    markRead(selected.id);
  },[selected?.id]);

  // Scroll to bottom on new messages
  useEffect(()=>{try{messagesEndRef.current?.scrollIntoView({behavior:"auto"})}catch{}},[chatMessages]);

  const sendReply=async()=>{
    if(!selected||!reply.trim()||sending)return;
    const text=reply.trim();
    setReply("");
    setSending(true);
    // Optimistic message (temp id)
    const tmpMsg={id:"tmp_"+Date.now(),user_id:selected.id,text,from_admin:1,direction:"out",created_at:new Date().toISOString()};
    setChatMessages(prev=>[...prev,tmpMsg]);
    try{
      const sent=await apiPost("/api/messages/"+selected.id+"/send",{text});
      // Replace temp message with real one from server
      setChatMessages(prev=>prev.map(m=>m.id===tmpMsg.id?{...sent,direction:"out"}:m));
      setConversations(prev=>prev.map(c=>c.id===selected.id?{...c,last_message:text,last_message_time:new Date().toISOString(),from_admin:1}:c));
    }catch(e){
      // Remove failed optimistic message, restore input
      setChatMessages(prev=>prev.filter(m=>m.id!==tmpMsg.id));
      setReply(text);
      const msg=e.message&&e.message.length<120?e.message:"Service temporairement indisponible";
      showToast("❌ Envoi échoué : "+msg);
    }
    setSending(false);
  };

  const sendBroadcast=async()=>{
    if(!broadcast.trim())return;
    if(!confirm(`Envoyer à tous les utilisateurs (${conversations.length} contacts) ?`))return;
    setBroadcasting(true);
    const text=broadcast.trim();
    try{
      const r=await apiPost("/api/broadcast",{text});
      showToast(`✅ Envoyé à ${r.sent}/${r.total} clients`);
      setBroadcast("");
      // Refresh broadcast history only (don't risk wiping conversations)
      apiGet("/api/broadcasts").then(bh=>{if(Array.isArray(bh)){_bcastCache=bh;setBroadcastHistory(bh);}}).catch(()=>{});
    }catch(e){
      const msg=e.message&&e.message.length<120?e.message:"Service indisponible";
      showToast("❌ Broadcast échoué : "+msg);
    }
    setBroadcasting(false);
  };


  const renderMessage=m=>{
    const mt=m.media_type,url=m.media_url;
    const isImg=url&&(mt==="image"||(!mt&&/\.(jpg|jpeg|png|webp|gif)(\?|$)/i.test(url)));
    const isVid=url&&(mt==="video"||(!mt&&/\.(mp4|webm|mov)(\?|$)/i.test(url)));
    const isAud=url&&(mt==="audio"||(!mt&&/\.(ogg|mp3|m4a|wav)(\?|$)/i.test(url)));
    return<div style={{padding:url?"6px":"9px 13px",borderRadius:m.direction==="out"?"16px 16px 4px 16px":"16px 16px 16px 4px",background:m.direction==="out"?C.accent:C.surface,color:m.direction==="out"?C.bg:C.text1,fontSize:13,lineHeight:1.5,wordBreak:"break-word",overflow:"hidden"}}>
      {isImg&&<img src={url} alt="" style={{width:"100%",maxWidth:240,borderRadius:8,display:"block",cursor:"pointer"}} onClick={()=>window.open(url,"_blank")}/>}
      {isVid&&<video src={url} controls style={{width:"100%",maxWidth:240,borderRadius:8,display:"block"}}/>}
      {isAud&&<audio controls src={url} style={{width:"100%",height:32,borderRadius:8}}/>}
      {m.text&&m.text!=="📷 Photo"&&m.text!=="🎬 Vidéo"&&<span style={{padding:url?"0 4px 4px":0,display:"block"}}>{m.text}</span>}
    </div>;
  };

  const clientOrders=selected?orders.filter(o=>String(o.user_id)===String(selected.id)):[];
  const updateOrderStatus=async(id,status)=>{
    setUpdatingO(true);
    try{await apiPatch("/api/orders/"+id+"/status",{status});if(setOrders)setOrders(prev=>prev.map(o=>o.id===id?{...o,status}:o));}catch(e){}
    setUpdatingO(false);
  };

  const totalUnread=conversations.reduce((s,c)=>s+(c.unread_count||0),0);

  return<div className="fade-in" style={{display:"flex",flexDirection:"column",height:"calc(100vh - 64px)"}}>
    <Toast msg={toast}/>
    <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:14,flexShrink:0,flexWrap:"wrap",gap:8}}>
      <div>
        <div style={{fontFamily:"'Bebas Neue'",fontSize:34,letterSpacing:"0.05em"}}>Messages</div>
        <div style={{fontSize:12,color:C.text3}}>
          {conversations.length} conversations
          {totalUnread>0&&<span style={{color:C.red,fontWeight:700,marginLeft:8}}>· {totalUnread} non lu{totalUnread>1?"s":""}</span>}
        </div>
      </div>
      <div style={{display:"flex",gap:8}}>
        <Btn variant="ghost" onClick={()=>fetchConversations()} style={{fontSize:12}}>🔄</Btn>
        <div style={{display:"flex",background:C.surface,border:`1px solid ${C.border}`,borderRadius:8,overflow:"hidden"}}>
          {["inbox","broadcast"].map(t=><button key={t} onClick={()=>setTab(t)} style={{padding:"7px 14px",background:tab===t?C.accent:"transparent",color:tab===t?C.bg:C.text2,border:"none",cursor:"pointer",fontSize:12,fontWeight:600,fontFamily:"'DM Sans',sans-serif"}}>
            {t==="inbox"?"💬 Inbox":"📢 Broadcast"}
          </button>)}
        </div>
      </div>
    </div>

    {loading?<div style={{flex:1,display:"flex",alignItems:"center",justifyContent:"center"}}><div className="spinner"/></div>:
    tab==="broadcast"?(
      <div style={{flex:1,overflowY:"auto"}}>
        <div style={{maxWidth:580}}>
          <Card style={{marginBottom:16}}>
            <div style={{fontFamily:"'Bebas Neue'",fontSize:18,letterSpacing:"0.05em",marginBottom:4}}>Envoyer à tous</div>
            <div style={{fontSize:12,color:C.text3,marginBottom:14}}>{conversations.length} utilisateurs</div>
            <textarea value={broadcast} onChange={e=>setBroadcast(e.target.value)} placeholder="Message..." style={{width:"100%",background:C.surface,border:`1px solid ${C.border}`,borderRadius:9,color:C.text1,fontSize:14,padding:"11px 13px",outline:"none",resize:"vertical",minHeight:90,fontFamily:"'DM Sans',sans-serif",boxSizing:"border-box"}} onFocus={e=>e.target.style.borderColor=C.accent} onBlur={e=>e.target.style.borderColor=C.border}/>
            <div style={{display:"flex",justifyContent:"flex-end",marginTop:10}}>
              <Btn onClick={sendBroadcast} disabled={broadcasting||!broadcast.trim()}>{broadcasting?"⏳ Envoi...":"📢 Envoyer à tous"}</Btn>
            </div>
          </Card>
          <div style={{fontFamily:"'Bebas Neue'",fontSize:16,letterSpacing:"0.05em",marginBottom:10,color:C.text2}}>Historique ({broadcastHistory.length})</div>
          {broadcastHistory.length===0&&<div style={{textAlign:"center",padding:"20px 0",color:C.text3,fontSize:13}}>Aucun broadcast envoyé</div>}
          {broadcastHistory.map((g,i)=><div key={i} style={{padding:"13px 15px",background:C.card,border:`1px solid ${C.border}`,borderRadius:9,marginBottom:9}}>
            <div style={{fontSize:13,color:C.text1,lineHeight:1.5,whiteSpace:"pre-wrap",marginBottom:7}}>{g.text}</div>
            <div style={{display:"flex",gap:8}}>
              <span style={{fontSize:11,color:C.text3}}>{new Date(g.created_at).toLocaleString("fr-FR")}</span>
              <span style={{fontSize:11,background:C.accentDim,color:C.accent,border:`1px solid ${C.accentMid}`,borderRadius:4,padding:"1px 7px"}}>📢 {g.recipients} dest.</span>
            </div>
          </div>)}
        </div>
      </div>
    ):(
      <div className="inbox-wrap" style={{border:`1px solid ${C.border}`}}>
        {/* Sidebar conversations */}
        <div className="inbox-users" style={{background:C.surface,borderRight:`1px solid ${C.border}`}}>
          <div style={{padding:"8px 10px",borderBottom:`1px solid ${C.border}`}}>
            <input value={searchConv} onChange={e=>setSearchConv(e.target.value)} placeholder="🔍 Rechercher..." style={{width:"100%",background:C.card,border:`1px solid ${C.border}`,borderRadius:8,color:C.text1,fontSize:12,padding:"6px 10px",outline:"none",boxSizing:"border-box"}} onFocus={e=>e.target.style.borderColor=C.accent} onBlur={e=>e.target.style.borderColor=C.border}/>
          </div>
          {filteredConvs.length===0&&<div style={{padding:24,textAlign:"center",color:C.text3,fontSize:13}}>Aucun message reçu</div>}
          {filteredConvs.map(c=>{
            const isSel=selected?.id===c.id,hasUnread=c.unread_count>0;
            const name=c.username?`@${c.username}`:`${c.first_name||""}${c.last_name?` ${c.last_name}`:""}`.trim()||`User ${c.id}`;
            return<div key={c.id} onClick={()=>{setSelected(c);setShowOrders(false);}} style={{padding:"11px 14px",cursor:"pointer",borderBottom:`1px solid ${C.border}`,background:isSel?C.accentDim:"transparent",borderLeft:isSel?`3px solid ${C.accent}`:hasUnread?`3px solid ${C.red}`:"3px solid transparent",transition:"background .1s"}} onMouseEnter={e=>!isSel&&(e.currentTarget.style.background="#ffffff06")} onMouseLeave={e=>!isSel&&(e.currentTarget.style.background="transparent")}>
              <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:2}}>
                <span style={{fontSize:13,fontWeight:hasUnread?700:600,color:isSel?C.accent:C.text1}}>{name}</span>
                {hasUnread&&<span style={{background:C.red,color:"#fff",borderRadius:10,fontSize:9,fontWeight:700,padding:"1px 6px"}}>{c.unread_count}</span>}
              </div>
              <div style={{fontSize:11,color:C.text3,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{c.from_admin?"✓ ":""}{c.last_message||"—"}</div>
              <div style={{fontSize:10,color:C.text3,marginTop:2}}>{c.last_message_time?new Date(c.last_message_time).toLocaleString("fr-FR",{hour:"2-digit",minute:"2-digit",day:"2-digit",month:"2-digit"}):""}</div>
            </div>;
          })}
        </div>

        {/* Chat view */}
        <div style={{flex:1,display:"flex",flexDirection:"column",background:C.card,minHeight:0}}>
          {!selected?<div style={{flex:1,display:"flex",alignItems:"center",justifyContent:"center",color:C.text3,fontSize:14}}>← Sélectionne une conversation</div>:<>
            <div style={{padding:"11px 16px",borderBottom:`1px solid ${C.border}`,display:"flex",alignItems:"center",justifyContent:"space-between",flexShrink:0,flexWrap:"wrap",gap:8}}>
              <div>
                <div style={{fontWeight:700,fontSize:14}}>{dn(selected)}</div>
                {selected.telegram_id&&<div style={{fontSize:10,color:C.text3}}>TG: {selected.telegram_id}</div>}
              </div>
              <div style={{display:"flex",gap:6,alignItems:"center"}}>
                {selected.username&&<a href={`https://t.me/${selected.username}`} target="_blank" style={{fontSize:11,color:C.accent,textDecoration:"none",background:C.accentDim,border:`1px solid ${C.accentMid}`,borderRadius:6,padding:"3px 9px"}}>🔗 Profil TG</a>}
                <button onClick={()=>setShowOrders(v=>!v)} style={{padding:"4px 10px",background:showOrders?C.accentDim:"transparent",border:`1px solid ${showOrders?C.accentMid:C.border}`,borderRadius:7,color:showOrders?C.accent:C.text2,cursor:"pointer",fontSize:11,fontWeight:600,fontFamily:"'DM Sans',sans-serif"}}>
                  🧾 {clientOrders.length} cmd{clientOrders.length!==1?"s":""}
                </button>
                <button onClick={()=>{setSelected(null);setShowOrders(false)}} style={{background:"none",border:"none",color:C.text3,cursor:"pointer",fontSize:18}}>×</button>
              </div>
            </div>

            {showOrders&&<div style={{borderBottom:`1px solid ${C.border}`,background:C.surface,padding:"10px 14px",maxHeight:220,overflowY:"auto",flexShrink:0}}>
              {clientOrders.length===0?<div style={{textAlign:"center",color:C.text3,fontSize:12}}>Aucune commande</div>
              :clientOrders.map(o=><div key={o.id} style={{marginBottom:9,padding:"9px 11px",background:C.card,borderRadius:7,border:`1px solid ${C.border}`}}>
                <div style={{display:"flex",justifyContent:"space-between",marginBottom:5}}>
                  <span style={{fontFamily:"'JetBrains Mono'",fontSize:11,color:C.accent}}>#{o.id}</span>
                  <span style={{fontSize:11,fontWeight:700}}>{fmt(parseFloat(o.total))}</span>

/* ── ZONES MAP ── */
function ZonesMapCard({zones,onZonesChange,onSave,saved}){
  const mapDiv=useRef(null);
  const mapInst=useRef(null);
  const drawnItems=useRef(null);
  const zonesRef=useRef(zones);
  const onChangeRef=useRef(onZonesChange);
  const [pending,setPending]=useState(null); // {layer, layerType}
  const [pendingName,setPendingName]=useState("");

  useEffect(()=>{zonesRef.current=zones;},[zones]);
  useEffect(()=>{onChangeRef.current=onZonesChange;},[onZonesChange]);

  /* Reconstruit un layer Leaflet à partir d'une zone sauvegardée */
  const layerFromZone=z=>{
    if(!window.L)return null;
    try{
      const style={color:"#ff4757",fillColor:"#ff4757",fillOpacity:0.2,weight:2};
      if(z.type==="circle")return window.L.circle([z.center[0],z.center[1]],{...style,radius:z.radius});
      return window.L.polygon(z.coords,style);
    }catch{return null;}
  };

  /* Sérialise un layer Leaflet dessiné en objet zone */
  const zoneFromLayer=(layer,layerType,name)=>{
    if(layerType==="circle"){
      const ll=layer.getLatLng();
      return{name,type:"circle",center:[ll.lat,ll.lng],radius:Math.round(layer.getRadius())};
    }
    const lls=layer.getLatLngs()[0];
    return{name,type:"polygon",coords:lls.map(ll=>[ll.lat,ll.lng])};
  };

  /* Init carte — une seule fois */
  useEffect(()=>{
    if(!mapDiv.current||!window.L||mapInst.current)return;
    const map=window.L.map(mapDiv.current).setView([43.46,6.22],9);
    window.L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OpenStreetMap contributors',maxZoom:18}).addTo(map);
    const features=window.L.featureGroup().addTo(map);
    drawnItems.current=features;

    if(window.L.Control?.Draw){
      const shapeStyle={color:"#ff4757",fillColor:"#ff4757",fillOpacity:0.2,weight:2};
      const ctrl=new window.L.Control.Draw({
        draw:{
          polygon:{shapeOptions:shapeStyle,showArea:false,showLength:false},
          circle:{shapeOptions:shapeStyle},
          rectangle:{shapeOptions:shapeStyle},
          polyline:false,marker:false,circlemarker:false
        },
        edit:false
      });
      map.addControl(ctrl);
      map.on(window.L.Draw.Event.CREATED,e=>{
        setPending({layer:e.layer,layerType:e.layerType});
        setPendingName("");
      });
    }

    mapInst.current=map;
    return()=>{if(mapInst.current){mapInst.current.remove();mapInst.current=null;}};
  },[]);

  /* Redessine les zones sur la carte à chaque changement */
  useEffect(()=>{
    if(!mapInst.current||!drawnItems.current||!window.L)return;
    drawnItems.current.clearLayers();
    zones.forEach(z=>{
      const layer=layerFromZone(z);
      if(!layer)return;
      layer.addTo(drawnItems.current);
      layer.bindTooltip(z.name,{permanent:true,direction:"center",className:"zone-label"});
    });
  },[zones]);

  const confirmAdd=()=>{
    if(!pending||!pendingName.trim())return;
    const zone=zoneFromLayer(pending.layer,pending.layerType,pendingName.trim());
    const updated=[...zonesRef.current,zone];
    zonesRef.current=updated;
    onChangeRef.current(updated);
    setPending(null);setPendingName("");
  };

  return<Card style={{marginBottom:14}}>
    <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:10}}>
      <div style={{fontFamily:"'Bebas Neue'",fontSize:18,letterSpacing:"0.05em"}}>🗺️ Zones non livrées</div>
      {saved&&<span style={{fontSize:12,color:C.green,fontWeight:600}}>✓ Sauvegardé</span>}
    </div>
    <div style={{fontSize:12,color:C.text3,marginBottom:10}}>
      Utilisez les outils en haut à gauche pour dessiner une zone (polygone, rectangle, cercle). Zones rouges = secteurs non livrés.
    </div>
    <div ref={mapDiv} className="zone-map" style={{borderRadius:8,overflow:"hidden",border:`1px solid ${C.border}`,marginBottom:8}}/>
    {pending&&<div style={{display:"flex",gap:8,marginBottom:8,alignItems:"center",padding:"8px 10px",background:C.surface,borderRadius:8,border:`1px solid ${C.accentMid}`}}>
      <span style={{fontSize:12,color:C.text3,whiteSpace:"nowrap"}}>📍 Nom de la zone :</span>
      <input autoFocus value={pendingName} onChange={e=>setPendingName(e.target.value)}
        onKeyDown={e=>e.key==="Enter"&&confirmAdd()}
        placeholder="Ex: Draguignan, Toulon-est…"
        style={{flex:1,background:C.bg,border:`1px solid ${C.border}`,borderRadius:6,color:C.text1,fontSize:13,padding:"5px 9px",outline:"none"}}
        onFocus={e=>e.target.style.borderColor=C.accent} onBlur={e=>e.target.style.borderColor=C.border}/>
      <Btn onClick={confirmAdd} disabled={!pendingName.trim()} style={{fontSize:11,padding:"5px 10px"}}>Valider</Btn>
      <Btn variant="ghost" onClick={()=>{setPending(null);setPendingName("");}} style={{fontSize:11,padding:"5px 10px"}}>✕</Btn>
    </div>}
    <div style={{display:"flex",flexWrap:"wrap",gap:6,marginBottom:12,minHeight:28}}>
      {zones.length===0
        ?<span style={{fontSize:12,color:C.text3}}>Aucune zone — dessinez sur la carte pour en ajouter</span>
        :zones.map((z,i)=><span key={i} onClick={()=>onZonesChange(zones.filter((_,j)=>j!==i))}
            style={{fontSize:11,padding:"3px 9px",background:"#ff475715",color:"#ff4757",border:"1px solid #ff475730",borderRadius:20,cursor:"pointer",display:"inline-flex",alignItems:"center",gap:4}}>
            {z.type==="circle"?"⭕":"▭"} {z.name} <span style={{opacity:.6}}>✕</span>
          </span>)
      }
    </div>
    <Btn onClick={onSave} style={{fontSize:13}}>Sauvegarder les zones</Btn>
  </Card>;
}

      <div key={l.label} style={{padding:"11px 14px",background:C.surface,borderRadius:8,display:"flex",justifyContent:"space-between",alignItems:"center",gap:10,marginBottom:8}}>
        <div style={{flex:1,minWidth:0}}><div style={{fontSize:13,fontWeight:600}}>{l.label}</div><div style={{fontSize:11,color:C.text3,fontFamily:"'JetBrains Mono'",marginTop:1,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{l.sub}</div></div>
        <Btn variant="ghost" style={{fontSize:11,padding:"5px 12px",flexShrink:0}} onClick={()=>l.url&&window.open(l.url,"_blank")}>Ouvrir</Btn>
      </div>)}
    </Card>

    {/* Zone dangereuse */}
    <Card style={{border:`1px solid ${C.red}33`}}>
      <div style={{fontFamily:"'Bebas Neue'",fontSize:18,letterSpacing:"0.05em",marginBottom:6,color:C.red}}>⚠️ Zone dangereuse</div>
      <div style={{fontSize:12,color:C.text3,marginBottom:14}}>Ces actions sont irréversibles. Les produits, catégories, paramètres et codes promo sont conservés.</div>
      <div style={{padding:"14px 16px",background:"#ff475710",border:`1px solid ${C.red}33`,borderRadius:10,display:"flex",alignItems:"center",justifyContent:"space-between",flexWrap:"wrap",gap:10}}>
        <div>
          <div style={{fontSize:13,fontWeight:700,color:C.text1,marginBottom:3}}>Réinitialiser les données</div>
          <div style={{fontSize:11,color:C.text3}}>Efface toutes les commandes, messages, clients et paniers</div>
        </div>
        <button onClick={resetAllData} disabled={resetting} style={{padding:"8px 16px",borderRadius:8,background:C.red,border:"none",color:"#fff",fontSize:12,fontWeight:700,cursor:resetting?"not-allowed":"pointer",fontFamily:"'DM Sans',sans-serif",opacity:resetting?0.6:1}}>
          {resetting?"⏳ En cours...":"🗑 Tout effacer"}
        </button>
      </div>
    </Card>

    {/* Compte */}
    <Card>
      <div style={{fontFamily:"'Bebas Neue'",fontSize:18,letterSpacing:"0.05em",marginBottom:14}}>👤 Compte</div>
      <div style={{fontSize:13,color:C.text2,marginBottom:12}}>Connecté en tant qu'<strong style={{color:C.text1}}>Administrateur</strong></div>
      <div style={{display:"flex",gap:10}}>
        <button onClick={()=>window.location.reload()} style={{padding:"9px 18px",borderRadius:8,background:"transparent",border:`1px solid ${C.border}`,color:C.text2,fontSize:13,cursor:"pointer",fontFamily:"'DM Sans',sans-serif"}}>🔄 Recharger</button>
        <button onClick={logout} style={{padding:"9px 18px",borderRadius:8,background:"transparent",border:`1px solid ${C.red}44`,color:C.red,fontSize:13,cursor:"pointer",fontFamily:"'DM Sans',sans-serif"}}>Déconnexion</button>
      </div>
    </Card>
  </div>;
}

/* ── APP ── */
function App(){
  const [logged,setLogged]=useState(()=>{try{return localStorage.getItem("baltimore83_logged")==="1"}catch{return false}});
  const [page,setPage]=useState("dashboard");
  const [orders,setOrders]=useState([]);
  const [selectedOrder,setSelectedOrder]=useState(null);
  const [products,setProducts]=useState([]);
  const [loadO,setLoadO]=useState(false);
  const [loadP,setLoadP]=useState(false);
  const [unreadMsgCount,setUnreadMsgCount]=useState(0);
  const prevOrderIdsRef=useRef(null);

  const playBeep=()=>{try{const ctx=new(window.AudioContext||window.webkitAudioContext)();[[520,0,0.1],[780,0.13,0.1]].forEach(([freq,delay,dur])=>{const o=ctx.createOscillator();const g=ctx.createGain();o.connect(g);g.connect(ctx.destination);o.frequency.value=freq;g.gain.setValueAtTime(0.25,ctx.currentTime+delay);g.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+delay+dur);o.start(ctx.currentTime+delay);o.stop(ctx.currentTime+delay+dur+0.05);});}catch(e){}};

  const login=()=>{try{localStorage.setItem("baltimore83_logged","1")}catch{}setLogged(true)};
  const logout=()=>{try{localStorage.removeItem("baltimore83_logged")}catch{}setLogged(false)};

  const getSettings=()=>{try{return JSON.parse(localStorage.getItem("baltimore83_settings")||"{}")}catch{return{}}};

  const fetchOrders=async()=>{setLoadO(true);try{const resp=await apiGet("/api/orders");const data=resp?.orders;if(Array.isArray(data)){const mapped=data.map(o=>({...o,telegram_user:o.username?`@${o.username}`:[o.first_name,o.last_name].filter(Boolean).join(" ")||`User #${o.telegram_id}`}));setOrders(mapped);if(prevOrderIdsRef.current!==null){const hasNew=mapped.some(o=>!prevOrderIdsRef.current.includes(o.id));if(hasNew)playBeep();}prevOrderIdsRef.current=mapped.map(o=>o.id);}}catch(e){console.error(e)}setLoadO(false)};
  const fetchProducts=async()=>{setLoadP(true);try{const data=await apiGet("/api/products");if(Array.isArray(data))setProducts(data)}catch(e){console.error(e)}setLoadP(false)};

  const pollUnread=async()=>{
    try{
      const conversations=await apiGet("/api/messages");
      const convArr=Array.isArray(conversations)?conversations:[];
      const totalUnread=convArr.reduce((s,c)=>s+(c.unread_count||0),0);
      const prevCount=unreadMsgCount;
      setUnreadMsgCount(totalUnread);
      const s=getSettings();
      if(s.notifMessages&&"Notification" in window&&window.Notification?.permission==="granted"&&totalUnread>prevCount){
        try{new window.Notification("Baltimore 83 — Nouveau message",{body:"Nouveau message reçu",icon:""});}catch{}
      }
    }catch(e){}
  };

  useEffect(()=>{if(logged){fetchOrders();fetchProducts();pollUnread()}},[logged]);
  useEffect(()=>{if(!logged)return;const t=setInterval(fetchOrders,30000);return()=>clearInterval(t)},[logged]);
  useEffect(()=>{if(!logged)return;const t=setInterval(pollUnread,5000);return()=>clearInterval(t)},[logged]);

  const newCount=orders.filter(o=>o.status==="pending").length;
  if(!logged)return<LoginPage onLogin={login}/>;

  return<div style={{display:"flex",minHeight:"100vh"}}>
    <Sidebar page={page} setPage={setPage} onLogout={logout} newCount={newCount} unreadMsg={unreadMsgCount}/>
    <main className="main-content" style={{flex:1}}>
      {page==="dashboard"&&<DashboardPage orders={orders} products={products} setPage={setPage}/>}
      {page==="orders"&&<OrdersPage orders={orders} setOrders={setOrders} products={products} setProducts={setProducts} loading={loadO} reload={fetchOrders} selectedOrder={selectedOrder} setSelectedOrder={setSelectedOrder} getSettings={getSettings}/>}
      {page==="clients"&&<ClientsPage orders={orders} setOrders={setOrders} setProducts={setProducts}/>}
      {page==="catalog"&&<CatalogPage products={products} setProducts={setProducts} loading={loadP} reload={fetchProducts}/>}
      {page==="categories"&&<CategoriesPage/>}
      {page==="promos"&&<PromosPage/>}
      {page==="messages"&&<MessagesPage onRead={()=>{setUnreadMsgCount(0);pollUnread()}} onGoToOrder={id=>{setSelectedOrder(id);setPage("orders");fetchOrders()}} orders={orders} setOrders={setOrders} setProducts={setProducts} getSettings={getSettings}/>}
      {page==="settings"&&<SettingsPage orders={orders} logout={logout}/>}
    </main>
  </div>
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>

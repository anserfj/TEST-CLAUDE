<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>BALTIMORE 83 · Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"/>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.css"/>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.js"></script>
  <style>
  .zone-label{background:#ff4757!important;color:#fff!important;border:none!important;border-radius:4px!important;font-size:11px!important;font-weight:700!important;padding:2px 7px!important;white-space:nowrap!important;box-shadow:0 1px 6px rgba(0,0,0,.4)!important}
  .zone-label::before{display:none!important}
    *{margin:0;padding:0;box-sizing:border-box}
    body{background:#080a0e;color:#eef2f7;font-family:'DM Sans',sans-serif;min-height:100vh;overflow-x:hidden}
    ::-webkit-scrollbar{width:4px}::-webkit-scrollbar-track{background:#0f1318}::-webkit-scrollbar-thumb{background:#1e2530;border-radius:2px}
    input,select,textarea,button{font-family:'DM Sans',sans-serif}
    @keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
    @keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
    @keyframes scaleIn{from{transform:scale(.95);opacity:0}to{transform:scale(1);opacity:1}}
    @keyframes spin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
    @keyframes slideIn{from{transform:translateX(100%)}to{transform:translateX(0)}}
    .fade-in{animation:fadeIn .3s ease forwards}
    .scale-in{animation:scaleIn .25s ease forwards}
    .slide-in{animation:slideIn .25s ease forwards}
    .live-dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#00e676;animation:pulse 2s infinite}
    .spinner{width:24px;height:24px;border:2px solid #1e2530;border-top-color:#ffffff;border-radius:50%;animation:spin .7s linear infinite;margin:auto}
    .drop-zone{border:2px dashed #1e2530;border-radius:10px;padding:24px;text-align:center;cursor:pointer;transition:all .2s}
    .drop-zone:hover,.drop-zone.drag-over{border-color:#ffffff;background:#ffffff08}
    .drop-zone input[type=file]{display:none}
    .row-hover:hover{background:#ffffff06!important;cursor:pointer}
    @media(max-width:640px){button,select,input[type="date"]{min-height:42px}}
    @media(max-width:375px){.stats-grid{grid-template-columns:1fr!important}}
    @media(max-width:640px){.form-grid-cat{grid-template-columns:1fr!important}}
    .tag{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:12px;font-size:11px;font-weight:600}
    /* Responsive */
    .sidebar-desktop{display:flex}
    .sidebar-mobile{display:none}
    .main-content{margin-left:220px;max-width:calc(100vw - 220px);padding:28px 24px}
    .stats-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
    .hide-mobile{display:table-cell}
    .catalog-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
    .dash-grid-2{display:grid;grid-template-columns:1.8fr 1fr;gap:16px}
    .dash-grid-equal{display:grid;grid-template-columns:1fr 1fr;gap:16px}
    .inbox-wrap{display:flex;flex:1;min-height:0;border-radius:12px;overflow:hidden}
    .inbox-users{width:270px;flex-shrink:0;overflow-y:auto}
    .zone-map{height:360px}
    @media(max-width:640px){.zone-map{height:240px!important}}
    /* Detail modals */
    .detail-overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:500;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:20px 12px}
    .detail-sheet{width:100%;max-width:460px;border-radius:12px;margin:0 auto}
    @media(max-width:640px){
      .detail-overlay{padding:10px 8px}
      .detail-sheet{max-width:100%}
    }
    /* Responsive form grids */
    .form-grid-2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
    .form-grid-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
    .form-grid-promo{display:grid;grid-template-columns:1fr 1fr;gap:8px}
    .modal-inner{padding:24px}
    @media(max-width:900px){
      .stats-grid{grid-template-columns:repeat(2,1fr)!important}
      .dash-grid-2{grid-template-columns:1fr!important}
      .dash-grid-equal{grid-template-columns:1fr!important}
    }
    @media(max-width:640px){
      .sidebar-desktop{display:none!important}
      .sidebar-mobile{display:flex!important;position:fixed;bottom:0;left:0;right:0;height:60px;background:#0c0f14;border-top:1px solid #1e2530;z-index:200;align-items:stretch;padding-bottom:env(safe-area-inset-bottom);overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch;scrollbar-width:none}
      .sidebar-mobile::-webkit-scrollbar{display:none}
      .main-content{margin-left:0!important;max-width:100vw!important;padding:14px 10px calc(68px + env(safe-area-inset-bottom)) 10px!important;overflow-x:hidden}
      .stats-grid{grid-template-columns:repeat(2,1fr)!important;gap:8px!important}
      .hide-mobile{display:none!important}
      .catalog-grid{grid-template-columns:repeat(2,1fr)!important;gap:8px!important}
      .dash-grid-2{grid-template-columns:1fr!important}
      .dash-grid-equal{grid-template-columns:1fr!important}
      .inbox-wrap{flex-direction:column!important}
      .inbox-users{width:100%!important;max-height:180px!important;border-right:none!important;border-bottom:1px solid #1e2530!important}
      .form-grid-2{grid-template-columns:1fr!important}
      .form-grid-3{grid-template-columns:1fr 1fr!important}
      .form-grid-promo{grid-template-columns:1fr!important}
      .modal-inner{padding:14px!important}
      input,select,textarea{min-height:42px;font-size:16px!important}
      .card-mobile{padding:14px!important}
    }
    @media(max-width:375px){
      .stats-grid{grid-template-columns:1fr!important}
    }
  </style>
</head>
<body><div id="root"></div>
<script type="text/babel">
const {useState,useEffect,useRef,useMemo,useCallback}=React;

/* ── GLOBAL TOAST (utilisable partout, sans state React) ── */
function showToast(msg){const el=document.createElement("div");el.style.cssText="position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:#1a1a1a;border:1px solid rgba(255,255,255,.25);color:#f5f5f5;font-size:13px;font-weight:600;padding:9px 22px;border-radius:99px;white-space:nowrap;z-index:9999;font-family:'DM Sans',sans-serif;box-shadow:0 4px 20px rgba(0,0,0,.5);animation:fadeIn .2s ease";el.textContent=msg;document.body.appendChild(el);setTimeout(()=>el.remove(),2500);}

/* ── API LOCALE ── */
async function apiGet(p){const r=await fetch(p);if(!r.ok)throw new Error(await r.text());return r.json();}
async function apiPost(p,body){const r=await fetch(p,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});if(!r.ok)throw new Error(await r.text());return r.json();}
async function apiPut(p,body){const r=await fetch(p,{method:"PUT",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});if(!r.ok)throw new Error(await r.text());return r.json();}
async function apiPatch(p,body){const r=await fetch(p,{method:"PATCH",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});if(!r.ok)throw new Error(await r.text());return r.json();}
async function apiDelete(p){const r=await fetch(p,{method:"DELETE"});if(!r.ok)throw new Error(await r.text());return r.json();}

const C={bg:"#080a0e",surface:"#0f1318",card:"#111620",border:"#1e2530",accent:"#ffffff",accentDim:"#ffffff18",accentMid:"#ffffff44",gold:"#f0b429",green:"#00e676",red:"#ff4757",orange:"#ff9f43",purple:"#a78bfa",text1:"#eef2f7",text2:"#8b9ab0",text3:"#4a5568"};
const STATUS={pending:{label:"En attente",color:C.accent,bg:C.accentDim},confirmed:{label:"Confirmé",color:C.purple,bg:"#a78bfa18"},preparing:{label:"En prépa",color:C.gold,bg:"#f0b42918"},shipped:{label:"Expédié",color:C.green,bg:"#00e67618"},delivered:{label:"Livré",color:C.green,bg:"#00e67618"},cancelled:{label:"Annulé",color:C.red,bg:"#ff475718"}};
const fmt=n=>parseFloat(n||0).toFixed(2).replace(".",",")+"\u00a0€";
const isVideo=url=>url&&/\.(mp4|webm|mov|avi)(\?|$)/i.test(url);
const parseItems=items=>{try{return Array.isArray(items)?items:JSON.parse(items||"[]")}catch{return[]}};

/* ── ATOMS ── */
function Badge({status}){const c=STATUS[status]||STATUS.pending;return<span style={{display:"inline-flex",padding:"3px 10px",borderRadius:4,fontSize:11,fontWeight:600,letterSpacing:"0.06em",textTransform:"uppercase",color:c.color,background:c.bg,border:`1px solid ${c.color}33`}}>{c.label}</span>}
function Card({children,style={},onClick,className=""}){return<div onClick={onClick} className={`card-mobile ${className}`} style={{background:C.card,border:`1px solid ${C.border}`,borderRadius:12,padding:20,...style}} onMouseEnter={e=>onClick&&(e.currentTarget.style.borderColor=C.accentMid)} onMouseLeave={e=>onClick&&(e.currentTarget.style.borderColor=C.border)}>{children}</div>}
function Btn({children,onClick,variant="primary",style={},disabled,title}){
  const v={primary:{background:C.accent,color:C.bg,border:"none"},ghost:{background:"transparent",color:C.text2,border:`1px solid ${C.border}`},danger:{background:"transparent",color:C.red,border:`1px solid ${C.red}33`},gold:{background:C.gold,color:C.bg,border:"none"},purple:{background:C.purple,color:C.bg,border:"none"},green:{background:C.green,color:C.bg,border:"none"}};
  return<button title={title} onClick={onClick} disabled={disabled} style={{...v[variant],padding:"8px 14px",borderRadius:8,fontSize:13,fontWeight:600,cursor:disabled?"not-allowed":"pointer",opacity:disabled?.5:1,transition:"all .15s",display:"inline-flex",alignItems:"center",gap:6,...style}} onMouseEnter={e=>!disabled&&(e.currentTarget.style.opacity=".8")} onMouseLeave={e=>!disabled&&(e.currentTarget.style.opacity="1")}>{children}</button>
}
function Inp({label,value,onChange,type="text",placeholder,required,style={},min,max,note}){
  return<div style={{display:"flex",flexDirection:"column",gap:5,...style}}>
    {label&&<label style={{fontSize:12,fontWeight:600,color:C.text2,letterSpacing:"0.05em",textTransform:"uppercase"}}>{label}{required&&<span style={{color:C.red}}> *</span>}</label>}
    <input type={type} value={value} min={min} max={max} onChange={e=>onChange(e.target.value)} placeholder={placeholder} style={{background:C.surface,border:`1px solid ${C.border}`,borderRadius:8,color:C.text1,fontSize:14,padding:"9px 13px",outline:"none"}} onFocus={e=>e.target.style.borderColor=C.accent} onBlur={e=>e.target.style.borderColor=C.border}/>
    {note&&<div style={{fontSize:11,color:C.text3}}>{note}</div>}
  </div>
}
function Sel({label,value,onChange,options,style={}}){
  return<div style={{display:"flex",flexDirection:"column",gap:5,...style}}>
    {label&&<label style={{fontSize:12,fontWeight:600,color:C.text2,letterSpacing:"0.05em",textTransform:"uppercase"}}>{label}</label>}
    <select value={value} onChange={e=>onChange(e.target.value)} style={{background:C.surface,border:`1px solid ${C.border}`,borderRadius:8,color:C.text1,fontSize:14,padding:"9px 13px",outline:"none",cursor:"pointer"}} onFocus={e=>e.target.style.borderColor=C.accent} onBlur={e=>e.target.style.borderColor=C.border}>
      {options.map(o=><option key={o.value} value={o.value}>{o.label}</option>)}
    </select>
  </div>
}
function Toast({msg}){return msg?<div style={{position:"fixed",bottom:"calc(70px + env(safe-area-inset-bottom))",right:16,background:C.card,border:`1px solid ${C.border}`,borderRadius:10,padding:"12px 20px",fontSize:14,zIndex:9999,boxShadow:"0 8px 32px #00000080",animation:"fadeIn .2s ease"}}>{msg}</div>:null}

function StatCard({icon,label,value,sub,color=C.accent,trend,onClick}){
  return<div onClick={onClick} style={{background:C.card,border:`1px solid ${C.border}`,borderRadius:12,padding:16,position:"relative",overflow:"hidden",cursor:onClick?"pointer":"default",transition:"border-color .15s"}} onMouseEnter={e=>onClick&&(e.currentTarget.style.borderColor=C.accentMid)} onMouseLeave={e=>onClick&&(e.currentTarget.style.borderColor=C.border)}>
    <div style={{position:"absolute",top:0,right:0,width:70,height:70,background:`radial-gradient(circle at 100% 0%,${color}18 0%,transparent 70%)`}}/>
    <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:10}}>
      <span style={{fontSize:22}}>{icon}</span>
      {trend!==undefined&&<span style={{fontSize:10,fontWeight:700,color:trend>=0?C.green:C.red,background:trend>=0?"#00e67618":"#ff475718",padding:"2px 6px",borderRadius:4}}>{trend>=0?"↑":"↓"}{Math.abs(trend)}%</span>}
    </div>
    <div style={{fontFamily:"'Bebas Neue'",fontSize:28,color,letterSpacing:"0.03em",lineHeight:1}}>{value}</div>
    <div style={{fontSize:12,color:C.text2,marginTop:4,fontWeight:500}}>{label}</div>
    {sub&&<div style={{fontSize:11,color:C.text3,marginTop:2}}>{sub}</div>}
  </div>
}

/* ── MINI SPARKLINE ── */
function Sparkline({data,color=C.accent,height=40}){
  if(!data||data.length<2) return null;
  const max=Math.max(...data),min=Math.min(...data);
  const range=max-min||1;
  const w=100,h=height;
  const pts=data.map((v,i)=>`${(i/(data.length-1))*w},${h-((v-min)/range)*h}`).join(" ");
  return<svg viewBox={`0 0 ${w} ${h}`} style={{width:"100%",height}} preserveAspectRatio="none">
    <polyline points={pts} fill="none" stroke={color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"/>
    <polyline points={`0,${h} ${pts} ${w},${h}`} fill={`${color}18`} stroke="none"/>
  </svg>
}

/* ── GALERIE EDITOR ── */
function GalerieEditor({medias,onChange}){
  const [urlInput,setUrlInput]=useState("");
  const [uploading,setUploading]=useState(false);
  const addUrl=url=>{if(!url)return;onChange([...medias,{url,type:isVideo(url)?"video":"image"}])};
  const remove=idx=>onChange(medias.filter((_,i)=>i!==idx));
  const moveFirst=idx=>{const c=[...medias];const[item]=c.splice(idx,1);onChange([item,...c])};
  const handleFile=async e=>{
    const file=e.target.files?.[0];if(!file)return;
    setUploading(true);
    try{
      const fd=new FormData();fd.append("file",file);
      const r=await fetch("/api/upload",{method:"POST",body:fd});
      if(!r.ok)throw new Error(await r.text());
      const {url}=await r.json();
      onChange([...medias,{url,type:isVideo(url)?"video":"image"}]);
    }catch(err){showToast("❌ Upload échoué : "+err.message.slice(0,80));}
    finally{setUploading(false);e.target.value="";}
  };
  return<div style={{display:"flex",flexDirection:"column",gap:10}}>
    <div style={{display:"flex",alignItems:"center",justifyContent:"space-between"}}>
      <label style={{fontSize:12,fontWeight:600,color:C.text2,letterSpacing:"0.05em",textTransform:"uppercase"}}>📸 Médias</label>
      <span style={{fontSize:11,color:C.text3}}>{medias.length===0?"Aucun":`${medias.length} fichier${medias.length>1?"s":""} · 1er = vignette`}</span>
    </div>
    {medias.length>0&&<div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(100px,1fr))",gap:8}}>
      {medias.map((m,i)=><div key={i} style={{position:"relative",borderRadius:8,overflow:"hidden",border:`2px solid ${i===0?C.accent:C.border}`,aspectRatio:"1/1",background:C.surface}}>
        {i===0&&<span style={{position:"absolute",top:4,left:4,background:C.accent,color:"#000",fontSize:8,fontWeight:700,padding:"1px 5px",borderRadius:3,zIndex:2}}>PRINCIPAL</span>}
        {m.type==="video"?<video src={m.url} style={{width:"100%",height:"100%",objectFit:"cover"}} autoPlay muted loop playsInline/>:<img src={m.url} style={{width:"100%",height:"100%",objectFit:"cover"}} alt=""/>}
        <div style={{position:"absolute",top:4,right:4,display:"flex",flexDirection:"column",gap:3}}>
          <button onClick={()=>remove(i)} style={{background:"#ff4757cc",border:"none",borderRadius:4,color:"#fff",cursor:"pointer",width:20,height:20,fontSize:11,display:"flex",alignItems:"center",justifyContent:"center"}}>✕</button>
          {i>0&&<button onClick={()=>moveFirst(i)} style={{background:"#ffffffcc",border:"none",borderRadius:4,color:"#000",cursor:"pointer",width:20,height:20,fontSize:10,fontWeight:700,display:"flex",alignItems:"center",justifyContent:"center"}}>★</button>}
        </div>
      </div>)}
    </div>}
    <div style={{display:"flex",gap:8}}>
      <label style={{padding:"7px 12px",fontSize:12,whiteSpace:"nowrap",background:C.accent,color:C.bg,borderRadius:8,fontWeight:600,cursor:uploading?"not-allowed":"pointer",opacity:uploading?.5:1,display:"inline-flex",alignItems:"center",gap:6,transition:"all .15s",fontFamily:"'DM Sans',sans-serif"}}>
        {uploading?"⏳ Upload...":"📁 Fichier"}
        <input type="file" accept="image/*,video/*" style={{display:"none"}} onChange={handleFile} disabled={uploading}/>
      </label>
      <input value={urlInput} onChange={e=>setUrlInput(e.target.value)} placeholder="https://... (URL photo ou vidéo)" onKeyDown={e=>e.key==="Enter"&&(addUrl(urlInput.trim()),setUrlInput(""))} style={{flex:1,background:C.surface,border:`1px solid ${C.border}`,borderRadius:8,color:C.text1,fontSize:13,padding:"7px 11px",outline:"none"}} onFocus={e=>e.target.style.borderColor=C.accent} onBlur={e=>e.target.style.borderColor=C.border}/>
      <Btn onClick={()=>{addUrl(urlInput.trim());setUrlInput("")}} style={{padding:"7px 12px",fontSize:12}}>+ URL</Btn>
    </div>
  </div>
}

function GoutsEditor({gouts,onChange}){
  const [v,setV]=useState("");
  const add=()=>{const g=v.trim();if(!g||gouts.includes(g))return;onChange([...gouts,g]);setV("")};
  return<div style={{display:"flex",flexDirection:"column",gap:8}}>
    <label style={{fontSize:12,fontWeight:600,color:C.text2,letterSpacing:"0.05em",textTransform:"uppercase"}}>Goûts</label>
    <div style={{display:"flex",flexWrap:"wrap",gap:5,minHeight:34,padding:8,background:C.surface,borderRadius:8,border:`1px solid ${C.border}`}}>
      {gouts.map((g,i)=><span key={i} style={{display:"inline-flex",alignItems:"center",gap:3,padding:"2px 8px",background:C.accentDim,border:`1px solid ${C.accentMid}`,borderRadius:16,fontSize:12,color:C.accent}}>
        {g}<button onClick={()=>onChange(gouts.filter((_,j)=>j!==i))} style={{background:"none",border:"none",color:C.accent,cursor:"pointer",fontSize:13,lineHeight:1}}>×</button>
      </span>)}
      {gouts.length===0&&<span style={{color:C.text3,fontSize:12,alignSelf:"center"}}>Aucun goût</span>}
    </div>
    <div style={{display:"flex",gap:8}}>
      <input value={v} onChange={e=>setV(e.target.value)} placeholder="Ex: Mangue Glacée" onKeyDown={e=>e.key==="Enter"&&add()} style={{flex:1,background:C.surface,border:`1px solid ${C.border}`,borderRadius:8,color:C.text1,fontSize:13,padding:"7px 11px",outline:"none"}} onFocus={e=>e.target.style.borderColor=C.accent} onBlur={e=>e.target.style.borderColor=C.border}/>
      <Btn onClick={add} style={{padding:"7px 12px",fontSize:12}}>+ Ajouter</Btn>
    </div>
  </div>
}

/* ── LOGIN ── */
function LoginPage({onLogin}){
  const [email,setEmail]=useState("");
  const [pass,setPass]=useState("");
  const [err,setErr]=useState("");
  const [isLoading,setLoading]=useState(false);
  const handle=async e=>{e.preventDefault();setLoading(true);setErr("");try{const r=await fetch("/api/auth/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({email,pass})});if(r.ok){onLogin();}else{const d=await r.json();setErr(d.error||"Email ou mot de passe incorrect.");}}catch{setErr("Impossible de contacter le serveur.");}setLoading(false);};
  return<div style={{minHeight:"100vh",display:"flex",alignItems:"center",justifyContent:"center",background:C.bg,position:"relative",overflow:"hidden"}}>
    <div style={{position:"absolute",inset:0,opacity:.03,backgroundImage:`linear-gradient(${C.accent} 1px,transparent 1px),linear-gradient(90deg,${C.accent} 1px,transparent 1px)`,backgroundSize:"40px 40px"}}/>
    <div style={{position:"absolute",top:"20%",left:"10%",width:300,height:300,background:`radial-gradient(circle,${C.accent}12 0%,transparent 70%)`,borderRadius:"50%",pointerEvents:"none"}}/>

/* ── DASHBOARD ── */
function DashboardPage({orders,products,setPage}){
  const now=new Date(),thisMonth=now.getMonth(),thisYear=now.getFullYear();
  const active=orders.filter(o=>o.status!=="cancelled");
  const totalCA=active.reduce((s,o)=>s+parseFloat(o.total)+parseFloat(o.livraison||0),0);
  const monthOrders=active.filter(o=>{const d=new Date(o.created_at);return d.getMonth()===thisMonth&&d.getFullYear()===thisYear});
  const monthCA=monthOrders.reduce((s,o)=>s+parseFloat(o.total)+parseFloat(o.livraison||0),0);
  const newOrders=orders.filter(o=>o.status==="pending").length;
  const shipped=orders.filter(o=>o.status==="shipped").length;
  const avgOrder=active.length?totalCA/active.length:0;
  // Tendance : cette semaine vs semaine précédente
  const weekCA=(offset=0)=>{
    const start=new Date(now);start.setDate(start.getDate()-offset*7-7);
    const end=new Date(now);end.setDate(end.getDate()-offset*7);
    return active.filter(o=>{const d=new Date(o.created_at);return d>=start&&d<=end}).reduce((s,o)=>s+parseFloat(o.total)+parseFloat(o.livraison||0),0);
  };
  const thisWeek=weekCA(0),lastWeek=weekCA(1);
  const weekTrend=lastWeek>0?Math.round(((thisWeek-lastWeek)/lastWeek)*100):0;

  // Top 5 produits vendus
  const topProducts=useMemo(()=>{
    const counts={};
    active.forEach(o=>parseItems(o.items).forEach(i=>{counts[i.name]=(counts[i.name]||0)+(i.quantity||i.qty||0)}));
    return Object.entries(counts).sort((a,b)=>b[1]-a[1]).slice(0,5);
  },[orders]);

  // Sparkline CA 14 jours
  const sparkData=useMemo(()=>{
    const days=14;const data=Array(days).fill(0);
    active.forEach(o=>{const d=new Date(o.created_at);const diff=Math.floor((now-d)/(1000*60*60*24));if(diff<days)data[days-1-diff]+=parseFloat(o.total)+parseFloat(o.livraison||0)});
    return data;
  },[orders]);

  // Commandes en attente de traitement
  const pending=orders.filter(o=>["pending","confirmed"].includes(o.status)).length;

  return<div className="fade-in" style={{display:"flex",flexDirection:"column",gap:20}}>
    <div style={{display:"flex",alignItems:"flex-start",justifyContent:"space-between",flexWrap:"wrap",gap:10}}>
      <div>
        <div style={{fontFamily:"'Bebas Neue'",fontSize:34,letterSpacing:"0.05em"}}>Dashboard</div>
        <div style={{fontSize:12,color:C.text3,marginTop:2}}>
          {new Date().toLocaleDateString("fr-FR",{weekday:"long",day:"numeric",month:"long"})} ·{" "}
          <a href="#" onClick={async e=>{e.preventDefault();try{const c=await apiGet("/api/config");if(c.miniapp_url)window.open(c.miniapp_url,"_blank");}catch{}}} style={{color:C.accent,textDecoration:"none"}}>Voir la boutique →</a>
        </div>
      </div>
      <div style={{display:"flex",gap:8}}>
        {pending>0&&<div style={{display:"flex",alignItems:"center",gap:6,padding:"6px 12px",background:"#f0b42918",border:`1px solid ${C.gold}33`,borderRadius:8,fontSize:12,color:C.gold,cursor:"pointer"}} onClick={()=>setPage("orders")}>
          ⏳ {pending} à traiter
        </div>}
        <Btn onClick={()=>setPage("orders")} style={{fontSize:12}}>Commandes →</Btn>
      </div>
    </div>

    {/* Stats */}
    <div className="stats-grid">
      <StatCard icon="💰" label="CA total" value={fmt(totalCA)} sub={`${fmt(monthCA)} ce mois`} color={C.accent} trend={weekTrend} onClick={()=>setPage("orders")}/>
      <StatCard icon="📦" label="Commandes" value={String(orders.length)} sub={`${newOrders} nouvelles`} color={C.gold} trend={8} onClick={()=>setPage("orders")}/>
      <StatCard icon="🚚" label="Expédiées" value={String(shipped)} sub={`${active.length} actives`} color={C.green} onClick={()=>setPage("orders")}/>
      <StatCard icon="💳" label="Panier moyen" value={fmt(avgOrder)} sub={`${monthOrders.length} cmd ce mois`} color={C.purple}/>
    </div>

    <div className="dash-grid-2" style={{gap:16}}>
      {/* CA 14 jours */}
      <Card>
        <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:12}}>
          <div>
            <div style={{fontFamily:"'Bebas Neue'",fontSize:18,letterSpacing:"0.05em"}}>CA — 14 derniers jours</div>
            <div style={{fontSize:11,color:weekTrend>=0?C.green:C.red,marginTop:2,fontWeight:600}}>{weekTrend>=0?"↑":"↓"} {Math.abs(weekTrend)}% vs semaine précédente</div>
          </div>
          <span style={{fontSize:14,fontWeight:700,color:C.accent}}>{fmt(sparkData.reduce((a,b)=>a+b,0))}</span>
        </div>
        <Sparkline data={sparkData} color={C.accent} height={56}/>
        <div style={{display:"flex",justifyContent:"space-between",marginTop:5}}>
          <span style={{fontSize:10,color:C.text3}}>J-14</span>
          <span style={{fontSize:10,color:C.text3}}>Aujourd'hui</span>
        </div>
      </Card>

      {/* Statuts */}
      <Card>
        <div style={{fontFamily:"'Bebas Neue'",fontSize:18,letterSpacing:"0.05em",marginBottom:14}}>Statuts</div>
        {Object.entries(STATUS).map(([k,v])=>{const n=orders.filter(o=>o.status===k).length;const pct=orders.length?Math.round(n/orders.length*100):0;return<div key={k} style={{marginBottom:10}}>
          <div style={{display:"flex",justifyContent:"space-between",marginBottom:4}}><span style={{color:v.color,fontSize:12,fontWeight:600}}>{v.label}</span><span style={{color:C.text3,fontSize:11}}>{n}</span></div>
          <div style={{height:4,background:C.border,borderRadius:2}}><div style={{height:"100%",width:`${pct}%`,background:v.color,borderRadius:2,transition:"width .4s"}}/></div>
        </div>})}
      </Card>
    </div>

    <div className="dash-grid-equal" style={{gap:16}}>
      {/* Top produits */}
      <Card>
        <div style={{fontFamily:"'Bebas Neue'",fontSize:18,letterSpacing:"0.05em",marginBottom:14}}>🏆 Top produits</div>
        {topProducts.length===0?<div style={{color:C.text3,fontSize:13}}>Aucune vente</div>:topProducts.map(([name,qty],i)=>{
          const maxQty=topProducts[0][1];
          return<div key={name} style={{marginBottom:10}}>
            <div style={{display:"flex",justifyContent:"space-between",marginBottom:4}}>
              <span style={{fontSize:12,color:C.text1}}><span style={{color:C.text3,marginRight:6}}>#{i+1}</span>{name}</span>
              <span style={{fontSize:12,fontWeight:700,color:C.accent}}>{qty} u.</span>
            </div>
            <div style={{height:3,background:C.border,borderRadius:2}}><div style={{height:"100%",width:`${(qty/maxQty)*100}%`,background:C.accent,borderRadius:2}}/></div>
          </div>
        })}
      </Card>

      {/* Dernières commandes */}
      <Card style={{padding:0,overflow:"hidden"}}>
        <div style={{padding:"14px 18px",borderBottom:`1px solid ${C.border}`,display:"flex",alignItems:"center",justifyContent:"space-between"}}>
          <div style={{fontFamily:"'Bebas Neue'",fontSize:18,letterSpacing:"0.05em"}}>Récentes</div>
          <button onClick={()=>setPage("orders")} style={{fontSize:12,color:C.accent,background:"none",border:"none",cursor:"pointer"}}>Tout voir →</button>
        </div>
        {orders.slice(0,5).map((o,i)=><div key={o.id} style={{padding:"10px 18px",borderBottom:i<4?`1px solid ${C.border}`:"none",display:"flex",alignItems:"center",justifyContent:"space-between",cursor:"pointer"}} onClick={()=>setPage("orders")} className="row-hover">
          <div>
            <div style={{fontSize:12,fontFamily:"'JetBrains Mono'",color:C.accent}}>{o.id}</div>
            <div style={{fontSize:11,color:C.text3}}>{o.telegram_user}</div>
          </div>
          <div style={{textAlign:"right"}}>
            <div style={{fontSize:12,fontWeight:700}}>{fmt(parseFloat(o.total)+parseFloat(o.livraison||0))}</div>
            <Badge status={o.status}/>
          </div>
        </div>)}
      </Card>
    </div>

    <AnalyticsSection orders={orders} setPage={setPage}/>
  </div>
}

/* ── ANALYTICS (revenue by category + top clients) ── */
function AnalyticsSection({orders,setPage}){
  const [stats,setStats]=useState(null);
  useEffect(()=>{apiGet("/api/stats").then(s=>setStats(s)).catch(()=>{});},[orders.length]);

  if(!stats)return null;
  const {revenueByCategory=[],topClients=[]}=stats;
  const maxCatRev=revenueByCategory[0]?.revenue||1;
  const maxClientSpend=topClients[0]?.total_spent||1;
  const dn=u=>u.username?`@${u.username}`:`${u.first_name||""}${u.last_name?` ${u.last_name}`:""}`.trim()||`User ${u.id}`;

  return<div className="dash-grid-equal" style={{gap:16}}>

          </div>
          <div style={{height:3,background:C.border,borderRadius:2}}><div style={{height:"100%",width:`${(c.revenue/maxCatRev)*100}%`,background:C.gold,borderRadius:2,transition:"width .4s"}}/></div>
          <div style={{fontSize:10,color:C.text3,marginTop:2}}>{c.sold||0} unités vendues</div>

        <button onClick={()=>setPage("clients")} style={{fontSize:12,color:C.accent,background:"none",border:"none",cursor:"pointer"}}>Voir tous →</button>
      </div>
      {topClients.filter(c=>c.total_spent>0).length===0

        :topClients.filter(c=>c.total_spent>0).map((c,i)=><div key={c.id} style={{display:"flex",alignItems:"center",gap:10,marginBottom:10}}>
          <div style={{width:24,height:24,borderRadius:6,background:i===0?"#f0b42922":C.accentDim,display:"flex",alignItems:"center",justifyContent:"center",fontSize:12,fontWeight:700,color:i===0?C.gold:C.text2,flexShrink:0}}>#{i+1}</div>
          <div style={{flex:1,minWidth:0}}>
            <div style={{fontSize:13,fontWeight:600,color:C.text1,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{dn(c)}</div>
            <div style={{fontSize:10,color:C.text3}}>{c.order_count} commande{c.order_count>1?"s":""}</div>
          </div>
          <div style={{fontSize:13,fontWeight:700,color:i===0?C.gold:C.accent,flexShrink:0}}>{fmt(c.total_spent)}</div>

      }
    </Card>
  </div>
}


/* ── ORDERS ── */
function OrdersPage({orders,setOrders,products,setProducts,loading,reload,selectedOrder,setSelectedOrder,getSettings}){
  const [filter,setFilter]=useState("tous");
  const [search,setSearch]=useState("");
  const [sort,setSort]=useState("date_desc");
  const [selected,setSelected]=useState(null);
  const [loadingDetail,setLoadingDetail]=useState(false);
  const [updating,setUpdating]=useState(false);
  const [dateFrom,setDateFrom]=useState("");
  const [dateTo,setDateTo]=useState("");
  const [note,setNote]=useState("");
  const [savingNote,setSavingNote]=useState(false);
  const [bulkSelected,setBulkSelected]=useState([]);
  const [bulkUpdating,setBulkUpdating]=useState(false);

  // Fetch full order detail (with items) when selecting an order
  const selectOrder=async(o)=>{
    if(selected?.id===o.id){setSelected(null);return;}
    setSelected(o); // immediate: shows panel right away
    setLoadingDetail(true);
    try{
      const detail=await apiGet("/api/orders/"+o.id);
      const tu=detail.username?`@${detail.username}`:[detail.first_name,detail.last_name].filter(Boolean).join(" ")||`User #${detail.telegram_id}`;
      setSelected({...detail,telegram_user:tu});
      setNote(detail.notes||"");
    }catch(e){console.error(e)}
    setLoadingDetail(false);
  };

  useEffect(()=>{
    if(selectedOrder&&orders.length>0){const o=orders.find(x=>x.id===selectedOrder);if(o){selectOrder(o);if(setSelectedOrder)setSelectedOrder(null)}}
  },[selectedOrder,orders]);

  useEffect(()=>{if(selected)setNote(selected.note||"")},[selected]);

  const updateStatus=async(id,status)=>{
    setUpdating(true);
    try{
      const order=orders.find(o=>o.id===id);
      if(!order){setUpdating(false);return;}
      const prevStatus=order.status;
      await apiPatch("/api/orders/"+id+"/status",{status});
      setOrders(prev=>prev.map(o=>o.id===id?{...o,status}:o));
      setSelected(prev=>prev?.id===id?{...prev,status}:prev);

      const items=parseItems(order.items);

    }catch(e){showToast("❌ "+e.message.slice(0,100))}

    /* auto-messages handled by bot */
    setUpdating(false);
  };

  // Multi-sélection : changer le statut de plusieurs commandes
  const bulkUpdateStatus=async(status)=>{
    if(!bulkSelected.length)return;
    if(!confirm(`Passer ${bulkSelected.length} commande(s) au statut "${STATUS[status].label}" ?`))return;
    setBulkUpdating(true);
    for(const id of bulkSelected){await updateStatus(id,status).catch(()=>{});}
    setBulkSelected([]);
    setBulkUpdating(false);
  };

  const saveNote=async()=>{
    if(!selected)return;setSavingNote(true);
    try{
      await apiPatch("/api/orders/"+selected.id+"/notes",{notes:note});
      setOrders(prev=>prev.map(o=>o.id===selected.id?{...o,notes:note}:o));
      setSelected(prev=>prev?{...prev,notes:note}:prev);
      showToast("✅ Note sauvegardée");
    }catch(e){showToast("❌ "+e.message.slice(0,100))}
    setSavingNote(false);
  };

  const exportCSV=()=>{
    const rows=[["ID","Client","Date","Total","Livraison","Statut","Articles"],...filtered.map(o=>[o.id,o.telegram_user,new Date(o.created_at).toLocaleDateString("fr-FR"),(parseFloat(o.total)+parseFloat(o.livraison||0)).toFixed(2),o.status,parseItems(o.items).map(i=>`${i.name}×${i.qty}`).join("|")])];
    const csv=rows.map(r=>r.map(c=>`"${String(c).replace(/"/g,'""')}"`).join(",")).join("\n");
    const a=document.createElement("a");a.href="data:text/csv;charset=utf-8,"+encodeURIComponent(csv);a.download=`commandes_${new Date().toISOString().slice(0,10)}.csv`;a.click();
  };

  const printOrder=o=>{
    const li=o.livraison_info?(typeof o.livraison_info==="string"?JSON.parse(o.livraison_info):o.livraison_info):null;
    const items=parseItems(o.items);
    const w=window.open("","_blank");
    w.document.write(`<!DOCTYPE html><html><head><meta charset="UTF-8"><title>BALTIMORE 83 · Dashboard</title><style>body{font-family:sans-serif;max-width:600px;margin:40px auto;color:#111;font-size:14px}h1{font-size:22px;margin-bottom:4px}table{width:100%;border-collapse:collapse;margin:16px 0}td,th{padding:8px 10px;border:1px solid #ddd;text-align:left}th{background:#f5f5f5}tfoot td{font-weight:700}@media print{button{display:none}}</style></head><body>
    <button onclick="window.print()" style="margin-bottom:20px;padding:8px 16px;cursor:pointer">🖨️ Imprimer</button>
    <h1>Commande ${o.id}</h1><p style="color:#666">${new Date(o.created_at).toLocaleString("fr-FR")} · ${o.telegram_user}</p>
    ${li?`<h3>Livraison</h3><p>${li.prenom||""} ${li.nom||""}<br>${li.adresse||""}<br>${li.cp||""} ${li.ville||""}<br>${li.tel||""}</p>`:""}
    <h3>Articles</h3>
    <table><thead><tr><th>Produit</th><th>Goût</th><th>Qté</th><th>P.U.</th><th>Total</th></tr></thead><tbody>
    ${items.map(i=>`<tr><td>${i.name}</td><td>${i.gout||"-"}</td><td>${i.qty}</td><td>${parseFloat(i.price).toFixed(2)} €</td><td>${(i.qty*i.price).toFixed(2)} €</td></tr>`).join("")}
    </tbody><tfoot><tr><td colspan="4">Livraison</td><td>${parseFloat(o.livraison||0)===0?"Offerte":parseFloat(o.livraison).toFixed(2)+" €"}</td></tr>
    <tr><td colspan="4"><strong>Total TTC</strong></td><td><strong>${(parseFloat(o.total)+parseFloat(o.livraison||0)).toFixed(2)} €</strong></td></tr></tfoot></table>
    <p>Statut : <strong>${o.status}</strong></p>
    ${o.note?`<p>Note : ${o.note}</p>`:""}
    </body></html>`);w.document.close();
  };

  const copyId=id=>{try{navigator.clipboard?.writeText(id).catch(()=>{})}catch{}};

  const [currentPage,setCurrentPage]=useState(1);
  const PAGE_SIZE=20;

  const filtered=useMemo(()=>{
    let r=orders.filter(o=>{
      if(filter!=="tous"&&o.status!==filter)return false;
      if(search&&!String(o.id).toLowerCase().includes(search.toLowerCase())&&!o.telegram_user.toLowerCase().includes(search.toLowerCase()))return false;
      if(dateFrom&&new Date(o.created_at)<new Date(dateFrom))return false;
      if(dateTo&&new Date(o.created_at)>new Date(dateTo+"T23:59:59"))return false;
      return true;
    });
    if(sort==="date_desc")r.sort((a,b)=>new Date(b.created_at)-new Date(a.created_at));
    else if(sort==="date_asc")r.sort((a,b)=>new Date(a.created_at)-new Date(b.created_at));
    else if(sort==="total_desc")r.sort((a,b)=>parseFloat(b.total)-parseFloat(a.total));
    else if(sort==="total_asc")r.sort((a,b)=>parseFloat(a.total)-parseFloat(b.total));
    return r;
  },[orders,filter,search,sort,dateFrom,dateTo]);

  const totalPages=Math.ceil(filtered.length/PAGE_SIZE);
  const paginated=filtered.slice((currentPage-1)*PAGE_SIZE,currentPage*PAGE_SIZE);
  const totalFiltered=filtered.reduce((s,o)=>s+parseFloat(o.total)+parseFloat(o.livraison||0),0);

  return<div className="fade-in" style={{display:"flex",flexDirection:"column",gap:16}}>
    <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",flexWrap:"wrap",gap:10}}>
      <div style={{fontFamily:"'Bebas Neue'",fontSize:34,letterSpacing:"0.05em"}}>Commandes</div>
      <div style={{display:"flex",gap:8}}>
        <Btn variant="ghost" onClick={exportCSV} style={{fontSize:12}}>📥 CSV</Btn>
        <Btn variant="ghost" onClick={reload} style={{fontSize:12}}>🔄</Btn>
      </div>
    </div>

    {/* Filtres */}
    <div style={{display:"flex",flexDirection:"column",gap:8}}>
      <input value={search} onChange={e=>setSearch(e.target.value)} placeholder="Rechercher ID, client..." style={{background:C.card,border:`1px solid ${C.border}`,borderRadius:8,color:C.text1,fontSize:13,padding:"9px 12px",outline:"none",width:"100%",boxSizing:"border-box"}} onFocus={e=>e.target.style.borderColor=C.accent} onBlur={e=>e.target.style.borderColor=C.border}/>
      <div style={{display:"flex",gap:8,flexWrap:"wrap",alignItems:"center"}}>
        <input type="date" value={dateFrom} onChange={e=>setDateFrom(e.target.value)} style={{background:C.card,border:`1px solid ${C.border}`,borderRadius:8,color:C.text2,fontSize:12,padding:"8px 10px",outline:"none",flex:1,minWidth:120}}/>
        <input type="date" value={dateTo} onChange={e=>setDateTo(e.target.value)} style={{background:C.card,border:`1px solid ${C.border}`,borderRadius:8,color:C.text2,fontSize:12,padding:"8px 10px",outline:"none",flex:1,minWidth:120}}/>
        <select value={sort} onChange={e=>setSort(e.target.value)} style={{background:C.card,border:`1px solid ${C.border}`,borderRadius:8,color:C.text2,fontSize:12,padding:"8px 10px",outline:"none",cursor:"pointer"}}>
          <option value="date_desc">Plus récent</option>
          <option value="date_asc">Plus ancien</option>
          <option value="total_desc">Total ↓</option>
          <option value="total_asc">Total ↑</option>
        </select>
      </div>
    </div>
    <div style={{display:"flex",gap:6,flexWrap:"wrap",alignItems:"center"}}>
      {[{v:"tous",l:"tous"},{v:"pending",l:"En attente"},{v:"confirmed",l:"Confirmé"},{v:"preparing",l:"En prépa"},{v:"shipped",l:"Expédié"},{v:"delivered",l:"Livré"},{v:"cancelled",l:"Annulé"}].map(s=><button key={s.v} onClick={()=>{setFilter(s.v);setCurrentPage(1)}} style={{padding:"5px 12px",borderRadius:6,fontSize:12,fontWeight:600,cursor:"pointer",textTransform:"capitalize",background:filter===s.v?C.accent:"transparent",color:filter===s.v?C.bg:C.text2,border:`1px solid ${filter===s.v?C.accent:C.border}`,fontFamily:"'DM Sans',sans-serif"}}>{s.l}</button>)}
      <span style={{marginLeft:"auto",fontSize:12,color:C.text3}}>{filtered.length} · {fmt(totalFiltered)}</span>
    </div>

    {/* Barre actions multi-sélection */}
    {bulkSelected.length>0&&<div style={{padding:"10px 14px",background:C.accentDim,border:`1px solid ${C.accentMid}`,borderRadius:9,display:"flex",alignItems:"center",gap:10,flexWrap:"wrap"}}>
      <span style={{fontSize:13,color:C.accent,fontWeight:600}}>{bulkSelected.length} sélectionné{bulkSelected.length>1?"s":""}</span>
      {Object.entries(STATUS).map(([key,cfg])=><button key={key} onClick={()=>bulkUpdateStatus(key)} disabled={bulkUpdating} style={{padding:"4px 10px",borderRadius:6,fontSize:11,fontWeight:600,cursor:"pointer",border:`1px solid ${cfg.color}`,background:cfg.bg,color:cfg.color,fontFamily:"'DM Sans',sans-serif",opacity:bulkUpdating?0.5:1}}>{cfg.label}</button>)}
      <button onClick={()=>setBulkSelected([])} style={{marginLeft:"auto",background:"none",border:"none",color:C.text3,cursor:"pointer",fontSize:14}}>✕ Annuler</button>
    </div>}

    {loading?<div style={{padding:60,display:"flex",justifyContent:"center"}}><div className="spinner"/></div>:
    <div style={{display:"flex",gap:14,flexWrap:"wrap"}}>
      <div style={{flex:1,minWidth:280,overflow:"auto"}}>
        <Card style={{padding:0,overflow:"hidden"}}>
          <table style={{width:"100%",borderCollapse:"collapse",minWidth:500}}>
            <thead><tr style={{borderBottom:`1px solid ${C.border}`,background:C.surface}}>
              <th style={{padding:"10px 10px",width:36}}><input type="checkbox" onChange={e=>setBulkSelected(e.target.checked?paginated.map(o=>o.id):[])} checked={paginated.length>0&&paginated.every(o=>bulkSelected.includes(o.id))}/></th>
              {["ID","Client","Date","Total","Statut","Action"].map((h,i)=><th key={h} className={i>=2&&i<=3?"hide-mobile":""} style={{padding:"10px 14px",textAlign:"left",fontSize:10,color:C.text3,fontWeight:700,letterSpacing:"0.08em",textTransform:"uppercase",whiteSpace:"nowrap"}}>{h}</th>)}
            </tr></thead>
            <tbody>
              {paginated.map((o,i)=><tr key={o.id} onClick={()=>selectOrder(o)} className="row-hover" style={{borderBottom:i<paginated.length-1?`1px solid ${C.border}`:"none",background:bulkSelected.includes(o.id)?C.accentDim:selected?.id===o.id?C.accentDim:"transparent",transition:"background .1s"}}>
                <td style={{padding:"11px 10px"}} onClick={e=>e.stopPropagation()}><input type="checkbox" checked={bulkSelected.includes(o.id)} onChange={e=>setBulkSelected(prev=>e.target.checked?[...prev,o.id]:prev.filter(x=>x!==o.id))}/></td>
                <td style={{padding:"11px 14px",fontFamily:"'JetBrains Mono'",fontSize:11,color:C.accent,whiteSpace:"nowrap"}}>{o.id}</td>
                <td style={{padding:"11px 14px",fontSize:13}}>{o.telegram_user}</td>
                <td className="hide-mobile" style={{padding:"11px 14px",fontSize:11,color:C.text3,whiteSpace:"nowrap"}}>{new Date(o.created_at).toLocaleDateString("fr-FR")}</td>
                <td className="hide-mobile" style={{padding:"11px 14px",fontSize:13,fontWeight:700}}>{fmt(parseFloat(o.total)+parseFloat(o.livraison||0))}</td>
                <td style={{padding:"11px 14px"}}><Badge status={o.status}/></td>
                <td style={{padding:"11px 14px"}}>
                  {o.status==="pending"&&<Btn variant="purple" style={{padding:"3px 9px",fontSize:10}} disabled={updating} onClick={e=>{e.stopPropagation();updateStatus(o.id,"confirmed")}}>💜 Confirmer</Btn>}
                  {o.status==="confirmed"&&<Btn variant="gold" style={{padding:"3px 9px",fontSize:10}} disabled={updating} onClick={e=>{e.stopPropagation();updateStatus(o.id,"preparing")}}>✓ Préparer</Btn>}
                  {o.status==="preparing"&&<Btn style={{padding:"3px 9px",fontSize:10}} disabled={updating} onClick={e=>{e.stopPropagation();updateStatus(o.id,"shipped")}}>🚚</Btn>}
                </td>
              </tr>)}
              {filtered.length===0&&<tr><td colSpan={6} style={{padding:40,textAlign:"center",color:C.text3}}>Aucune commande</td></tr>}
            </tbody>
          </table>
        </Card>
        {/* Pagination */}
        {totalPages>1&&<div style={{display:"flex",alignItems:"center",justifyContent:"center",gap:6,marginTop:12,flexWrap:"wrap"}}>
          <button onClick={()=>setCurrentPage(p=>Math.max(1,p-1))} disabled={currentPage===1} style={{padding:"7px 14px",background:C.card,border:`1px solid ${C.border}`,borderRadius:7,color:C.text2,cursor:currentPage===1?"not-allowed":"pointer",fontSize:13,opacity:currentPage===1?0.4:1,minHeight:38}}>← Préc.</button>
          <div style={{display:"flex",gap:4}}>
            {Array.from({length:Math.min(5,totalPages)},(_, i)=>{
              let p;
              if(totalPages<=5)p=i+1;
              else if(page<=3)p=i+1;
              else if(page>=totalPages-2)p=totalPages-4+i;
              else p=page-2+i;
              return<button key={p} onClick={()=>setCurrentPage(p)} style={{width:38,height:38,borderRadius:7,border:`1px solid ${currentPage===p?C.accent:C.border}`,background:currentPage===p?C.accent:"transparent",color:currentPage===p?C.bg:C.text2,cursor:"pointer",fontSize:13,fontWeight:currentPage===p?700:400}}>{p}</button>
            })}
          </div>
          <button onClick={()=>setCurrentPage(p=>Math.min(totalPages,p+1))} disabled={currentPage===totalPages} style={{padding:"7px 14px",background:C.card,border:`1px solid ${C.border}`,borderRadius:7,color:C.text2,cursor:currentPage===totalPages?"not-allowed":"pointer",fontSize:13,opacity:currentPage===totalPages?0.4:1,minHeight:38}}>Suiv. →</button>
          <span style={{fontSize:11,color:C.text3,width:"100%",textAlign:"center"}}>Page {currentPage}/{totalPages} · {filtered.length} résultats</span>
        </div>}
      </div>

      {/* Panneau détail */}
      {selected&&<div className="detail-overlay" onClick={e=>e.target===e.currentTarget&&setSelected(null)}>
      <div className="scale-in detail-sheet" style={{background:C.card,border:`1px solid ${C.border}`,borderRadius:12,padding:18}}>
          <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:16}}>
            <div style={{display:"flex",alignItems:"center",gap:8}}>
              <div style={{fontFamily:"'JetBrains Mono'",fontSize:13,color:C.accent,fontWeight:700,cursor:"pointer"}} onClick={()=>copyId(selected.id)} title="Copier l'ID">{selected.id} 📋</div>
            </div>
            <div style={{display:"flex",gap:6}}>
              <button onClick={()=>printOrder(selected)} title="Imprimer" style={{background:C.surface,border:`1px solid ${C.border}`,borderRadius:7,color:C.text2,cursor:"pointer",padding:"4px 9px",fontSize:12}}>🖨️</button>
              <button onClick={()=>setSelected(null)} style={{background:"none",border:"none",color:C.text3,cursor:"pointer",fontSize:18}}>×</button>
            </div>
          </div>
          <div style={{display:"flex",flexDirection:"column",gap:14}}>

              <div style={{fontSize:14,fontWeight:700,marginBottom:4}}>{selected.telegram_user}</div>
              <div style={{display:"flex",gap:5,flexWrap:"wrap"}}>
                {selected.telegram_id&&(()=>{const h=(()=>{try{return JSON.parse(localStorage.getItem("baltimore83_settings")||"{}")}catch{return{}}})().willyHandle;return h?<a href={`https://t.me/${h}?start=user_${selected.telegram_id}`} target="_blank" style={{fontSize:10,color:C.accent,textDecoration:"none",background:C.accentDim,border:`1px solid ${C.accentMid}`,borderRadius:4,padding:"2px 7px"}}>💬 Contacter</a>:null;})()}
                {selected.telegram_user?.startsWith("@")&&<a href={`https://t.me/${selected.telegram_user.slice(1)}`} target="_blank" style={{fontSize:10,color:C.text2,textDecoration:"none",background:C.surface,border:`1px solid ${C.border}`,borderRadius:4,padding:"2px 7px"}}>🔗 Profil</a>}
              </div>
              <div style={{fontSize:10,color:C.text3,marginTop:5}}>{new Date(selected.created_at).toLocaleString("fr-FR")}</div>
            </div>

            {/* Articles */}
            <div>
              <div style={{fontSize:11,color:C.text3,marginBottom:8,textTransform:"uppercase",letterSpacing:".06em"}}>Articles ({selected.item_count||0})</div>
              {loadingDetail
                ?<div style={{textAlign:"center",padding:"10px 0",color:C.text3,fontSize:12}}>Chargement...</div>
                :Array.isArray(selected.items)&&selected.items.length>0
                  ?selected.items.map((item,i)=><div key={i} style={{marginBottom:6,padding:"7px 10px",background:C.surface,borderRadius:7}}>
                      <div style={{fontSize:12,fontWeight:600}}>{item.name}</div>
                      <div style={{fontSize:11,color:C.text3,marginTop:2}}>×{item.quantity}{item.unit||""} · {fmt(item.unit_price)} = <strong style={{color:C.text2}}>{fmt(item.subtotal||item.unit_price*item.quantity)}</strong></div>
                    </div>)
                  :<div style={{fontSize:12,color:C.text3,padding:"6px 0"}}>Aucun article</div>
              }
            </div>

            {/* Livraison */}
            {(selected.delivery_name||selected.delivery_address)&&<div style={{padding:"10px 12px",background:C.surface,borderRadius:8}}>
              <div style={{fontSize:11,color:C.text3,marginBottom:6,textTransform:"uppercase",letterSpacing:".06em"}}>📦 Livraison</div>
              {[["Nom",selected.delivery_name],["Tél",selected.delivery_phone],["Adresse",selected.delivery_address],["Notes",selected.notes]].filter(([,v])=>v).map(([k,v])=><div key={k} style={{display:"flex",gap:8,marginBottom:3}}>
                <span style={{fontSize:10,color:C.text3,minWidth:50}}>{k}</span>
                <span style={{fontSize:12,color:k==="Tél"?C.accent:C.text1,wordBreak:"break-word"}}>{v}</span>
              </div>)}
            </div>}

            {/* Total */}
            <div style={{borderTop:`1px solid ${C.border}`,paddingTop:10}}>
              <div style={{display:"flex",justifyContent:"space-between",marginBottom:4}}><span style={{fontSize:12,color:C.text2}}>Sous-total</span><span style={{fontSize:12}}>{fmt(selected.total)}</span></div>
              <div style={{display:"flex",justifyContent:"space-between",marginBottom:8}}><span style={{fontSize:12,color:C.text2}}>Livraison</span><span style={{fontSize:12,color:parseFloat(selected.livraison||0)===0?C.green:C.text1}}>{parseFloat(selected.livraison||0)===0?"OFFERTE":fmt(selected.livraison)}</span></div>
              <div style={{display:"flex",justifyContent:"space-between"}}><span style={{fontWeight:700}}>Total</span><span style={{fontWeight:700,color:C.accent,fontSize:16}}>{fmt(parseFloat(selected.total)+parseFloat(selected.livraison||0))}</span></div>
            </div>

            {/* Statut */}
            <div>
              <div style={{fontSize:11,color:C.text3,marginBottom:7,textTransform:"uppercase",letterSpacing:".06em"}}>Statut</div>
              <div style={{display:"flex",gap:5,flexWrap:"wrap"}}>
                {Object.entries(STATUS).map(([key,cfg])=><button key={key} onClick={()=>updateStatus(selected.id,key)} disabled={updating} style={{padding:"4px 9px",borderRadius:6,fontSize:11,fontWeight:600,cursor:"pointer",border:`1px solid ${selected.status===key?cfg.color:C.border}`,background:selected.status===key?cfg.bg:"transparent",color:selected.status===key?cfg.color:C.text3,fontFamily:"'DM Sans',sans-serif"}}>{cfg.label}</button>)}
              </div>

            {/* Note interne */}
            <div>
              <div style={{fontSize:11,color:C.text3,marginBottom:6,textTransform:"uppercase",letterSpacing:".06em"}}>Note interne</div>
              <textarea value={note} onChange={e=>setNote(e.target.value)} placeholder="Ajouter une note..." rows={2} style={{width:"100%",background:C.surface,border:`1px solid ${C.border}`,borderRadius:8,color:C.text1,fontSize:13,padding:"8px 10px",outline:"none",resize:"vertical",fontFamily:"'DM Sans',sans-serif",boxSizing:"border-box"}} onFocus={e=>e.target.style.borderColor=C.accent} onBlur={e=>e.target.style.borderColor=C.border}/>
              <Btn onClick={saveNote} disabled={savingNote} style={{marginTop:6,width:"100%",justifyContent:"center",fontSize:12,padding:"7px"}}>{savingNote?"Sauvegarde...":"💾 Sauvegarder la note"}</Btn>
            </div>
          </div>
      </div>
      </div>}
    </div>}
  </div>
}

/* ── CLIENTS ── */
function ClientsPage({orders,setOrders}){
  const [clients,setClients]=useState([]);
  const [selected,setSelected]=useState(null);
  const [search,setSearch]=useState("");
  const [loading,setLoading]=useState(false);
  const [updating,setUpdating]=useState(false);
  const [sortBy,setSortBy]=useState("recent");
  const [noteText,setNoteText]=useState("");
  const [savingNote,setSavingNote]=useState(false);
  const [validating,setValidating]=useState(false);

  useEffect(()=>{setLoading(true);apiGet("/api/users").then(u=>setClients(u)).catch(console.error).finally(()=>setLoading(false));},[]);
  useEffect(()=>{if(selected)setNoteText(selected.notes||"")},[selected?.id]);

  const toggleValidation=async(client,val)=>{
    setValidating(true);
    try{
      await apiPatch("/api/users/"+client.id+"/validate",{validated:val});
      setClients(prev=>prev.map(c=>c.id===client.id?{...c,is_validated:val?1:0}:c));
      setSelected(prev=>prev&&prev.id===client.id?{...prev,is_validated:val?1:0}:prev);
      showToast(val?"✅ Client validé":"⚠️ Accès révoqué");
    }catch(e){showToast("❌ "+e.message.slice(0,100));}
    setValidating(false);
  };

  const dn=u=>u.username?`@${u.username}`:`${u.first_name||""}${u.last_name?` ${u.last_name}`:""}`.trim()||`User ${u.id}`;
  const clientOrders=uid=>orders.filter(o=>String(o.user_id)===String(uid));
  const ca=uid=>clientOrders(uid).filter(o=>o.status!=="cancelled").reduce((s,o)=>s+parseFloat(o.total)+parseFloat(o.livraison||0),0);

  const updateStatus=async(id,status)=>{
    setUpdating(true);
    try{
      const order=orders.find(o=>o.id===id);
      await apiPatch("/api/orders/"+id+"/status",{status});
      setOrders(prev=>prev.map(o=>o.id===id?{...o,status}:o));
      if(order){
        const prevStatus=order.status;
        const items=parseItems(order.items);
        if(status==="confirmed"&&(prevStatus==="pending"||prevStatus==="cancelled")){
          for(const item of items){/* stock auto-adjust removed */}
        }
        if(status==="cancelled"&&prevStatus!=="pending"&&prevStatus!=="cancelled"){
          for(const item of items){/* stock auto-adjust removed */}
        }
      }
    }catch(e){showToast("❌ "+e.message.slice(0,100))}
    setUpdating(false);
  };

  const saveNote=async()=>{
    if(!selected)return;
    setSavingNote(true);
    try{
      await apiPatch("/api/users/"+selected.id+"/notes",{notes:noteText.trim()||null});
      setClients(prev=>prev.map(c=>c.id===selected.id?{...c,notes:noteText.trim()||null}:c));
      setSelected(prev=>({...prev,notes:noteText.trim()||null}));
    }catch(e){showToast("❌ "+e.message.slice(0,100));}
    setSavingNote(false);
  };

  const sorted=useMemo(()=>{
    let r=[...clients].filter(c=>!search||dn(c).toLowerCase().includes(search.toLowerCase()));
    if(sortBy==="ca")r.sort((a,b)=>ca(b.id)-ca(a.id));
    else if(sortBy==="orders")r.sort((a,b)=>clientOrders(b.id).length-clientOrders(a.id).length);
    else r.sort((a,b)=>new Date(b.last_seen)-new Date(a.last_seen));
    return r;
  },[clients,search,sortBy,orders]);

  return<div className="fade-in" style={{display:"flex",flexDirection:"column",gap:16}}>
    <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",flexWrap:"wrap",gap:10}}>
      <div>
        <div style={{fontFamily:"'Bebas Neue'",fontSize:34,letterSpacing:"0.05em"}}>Clients</div>
        <div style={{fontSize:12,color:C.text3,marginTop:2}}>{clients.length} clients · {clients.filter(c=>clientOrders(c.id).length>0).length} ont commandé</div>
      </div>
    </div>

    <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
      <input value={search} onChange={e=>setSearch(e.target.value)} placeholder="Rechercher..." style={{flex:1,minWidth:140,background:C.card,border:`1px solid ${C.border}`,borderRadius:8,color:C.text1,fontSize:13,padding:"8px 12px",outline:"none"}} onFocus={e=>e.target.style.borderColor=C.accent} onBlur={e=>e.target.style.borderColor=C.border}/>
      <select value={sortBy} onChange={e=>setSortBy(e.target.value)} style={{background:C.card,border:`1px solid ${C.border}`,borderRadius:8,color:C.text2,fontSize:12,padding:"8px 10px",outline:"none",cursor:"pointer"}}>
        <option value="recent">Plus récent</option>
        <option value="ca">CA ↓</option>
        <option value="orders">Commandes ↓</option>
      </select>
    </div>

    {loading?<div style={{padding:60,display:"flex",justifyContent:"center"}}><div className="spinner"/></div>:
    <div style={{display:"flex",gap:14,flexWrap:"wrap"}}>
      <div style={{flex:1,minWidth:260}}>
        {sorted.map(c=>{
          const nb=clientOrders(c.id).length,caVal=ca(c.id),isSel=selected?.id===c.id;
          return<div key={c.id} onClick={()=>setSelected(isSel?null:c)} className="row-hover" style={{padding:"13px 16px",background:isSel?C.accentDim:C.card,border:`1px solid ${isSel?C.accentMid:C.border}`,borderRadius:10,marginBottom:8,cursor:"pointer",transition:"all .15s"}}>
            <div style={{display:"flex",alignItems:"center",justifyContent:"space-between"}}>
              <div style={{display:"flex",alignItems:"center",gap:10}}>
                <div style={{width:38,height:38,borderRadius:10,background:C.accentDim,border:`1px solid ${C.accentMid}`,display:"flex",alignItems:"center",justifyContent:"center",fontSize:16,flexShrink:0}}>👤</div>
                <div>
                  <div style={{display:"flex",alignItems:"center",gap:6}}>
                    <div style={{fontSize:13,fontWeight:700,color:isSel?C.accent:C.text1}}>{dn(c)}</div>
                    <span style={{fontSize:10,padding:"1px 5px",borderRadius:4,background:c.is_validated?"#00e67615":"#ff6b3515",color:c.is_validated?"#00e676":"#ff6b35",border:`1px solid ${c.is_validated?"#00e67630":"#ff6b3530"}`}}>{c.is_validated?"✅":"⚠️"}</span>
                  </div>
                  <div style={{fontSize:11,color:C.text3}}>Depuis {new Date(c.created_at).toLocaleDateString("fr-FR")} · Vu {new Date(c.last_seen).toLocaleDateString("fr-FR")}</div>
                </div>
              </div>
              <div style={{textAlign:"right",flexShrink:0}}>
                <div style={{fontSize:13,fontWeight:700,color:C.accent}}>{caVal>0?fmt(caVal):"—"}</div>
                <div style={{fontSize:11,color:C.text3}}>{nb} cmd{nb>1?"s":""}</div>
              </div>
            </div>
            {nb>0&&<div style={{display:"flex",gap:5,marginTop:8,flexWrap:"wrap"}}>
              {clientOrders(c.id).slice(0,3).map(o=><span key={o.id} style={{fontSize:10,padding:"2px 7px",background:STATUS[o.status]?.bg||C.accentDim,color:STATUS[o.status]?.color||C.accent,borderRadius:4,border:`1px solid ${STATUS[o.status]?.color||C.accent}33`}}>{o.id}</span>)}
              {nb>3&&<span style={{fontSize:10,color:C.text3}}>+{nb-3}</span>}
            </div>}
            {c.username&&<div style={{display:"flex",gap:5,marginTop:7}}>
              <a href={`https://t.me/${c.username}`} target="_blank" onClick={e=>e.stopPropagation()} style={{fontSize:10,color:C.accent,textDecoration:"none",background:C.accentDim,border:`1px solid ${C.accentMid}`,borderRadius:4,padding:"2px 7px"}}>🔗 Profil</a>
              {(()=>{const h=(()=>{try{return JSON.parse(localStorage.getItem("baltimore83_settings")||"{}")}catch{return{}}})().willyHandle;return h?<a href={`https://t.me/${h}?start=user_${c.id}`} target="_blank" onClick={e=>e.stopPropagation()} style={{fontSize:10,color:C.green,textDecoration:"none",background:"#00e67612",border:"1px solid #00e67630",borderRadius:4,padding:"2px 7px"}}>💬 Contacter</a>:null;})()}
            </div>}
          </div>
        })}
        {sorted.length===0&&<div style={{padding:40,textAlign:"center",color:C.text3,fontSize:13}}>Aucun client</div>}
      </div>

      {selected&&<div className="detail-overlay" onClick={e=>e.target===e.currentTarget&&setSelected(null)}>
      <div className="scale-in detail-sheet" style={{background:C.card,border:`1px solid ${C.border}`,borderRadius:12,padding:18}}>
          <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:16}}>
            <div style={{fontSize:14,fontWeight:700}}>{dn(selected)}</div>
            <button onClick={()=>setSelected(null)} style={{background:"none",border:"none",color:C.text3,cursor:"pointer",fontSize:22,lineHeight:1,padding:"4px 8px"}}>×</button>
          </div>
          <div style={{display:"flex",gap:10,marginBottom:14}}>
            <div style={{flex:1,padding:"10px",background:C.surface,borderRadius:8,textAlign:"center"}}>
              <div style={{fontFamily:"'Bebas Neue'",fontSize:22,color:C.accent}}>{fmt(ca(selected.id))}</div>
              <div style={{fontSize:11,color:C.text3}}>CA total</div>
            </div>
            <div style={{flex:1,padding:"10px",background:C.surface,borderRadius:8,textAlign:"center"}}>
              <div style={{fontFamily:"'Bebas Neue'",fontSize:22,color:C.gold}}>{clientOrders(selected.id).length}</div>
              <div style={{fontSize:11,color:C.text3}}>Commandes</div>
            </div>
          </div>
          {/* Validation & Parrainage */}
          <div style={{marginBottom:14,padding:"10px 12px",background:C.surface,borderRadius:8,border:`1px solid ${C.border}`}}>
            <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:8}}>
              <div style={{fontSize:12,fontWeight:700,color:selected.is_validated?C.green:C.gold}}>
                {selected.is_validated?"✅ Compte validé":"⚠️ Compte non validé"}
              </div>
              <button onClick={()=>toggleValidation(selected,!selected.is_validated)} disabled={validating}
                style={{fontSize:11,padding:"4px 10px",borderRadius:6,border:`1px solid ${selected.is_validated?"#ff6b3550":C.accentMid}`,background:selected.is_validated?"#ff6b3512":C.accentDim,color:selected.is_validated?"#ff6b35":C.accent,cursor:"pointer",fontFamily:"'DM Sans',sans-serif"}}>
                {validating?"...":(selected.is_validated?"Révoquer l'accès":"Valider")}
              </button>
            </div>
            {selected.referral_code&&<div style={{display:"flex",alignItems:"center",gap:6,marginTop:4}}>
              <span style={{fontSize:11,color:C.text3}}>Code parrainage :</span>
              <span style={{fontFamily:"'JetBrains Mono'",fontSize:12,color:C.accent,background:C.accentDim,padding:"2px 7px",borderRadius:4,border:`1px solid ${C.accentMid}`,letterSpacing:"0.1em"}}>{selected.referral_code}</span>
            </div>}
            {selected.referred_by&&(()=>{
              const parrain=clients.find(c=>c.id===selected.referred_by);
              const nomParrain=parrain?([parrain.first_name,parrain.last_name].filter(Boolean).join(" ")||parrain.username||`User #${parrain.id}`):`User #${selected.referred_by}`;
              return<div style={{fontSize:11,color:C.text3,marginTop:4}}>Parrainé par <span style={{color:C.accent,fontWeight:600,cursor:"pointer"}} onClick={()=>setSelected(parrain||selected)}>{nomParrain}</span></div>;
            })()}
          </div>
          {/* Filleuls */}
          {(()=>{const filleuls=clients.filter(c=>c.referred_by===selected.id);return filleuls.length>0&&<div style={{marginBottom:14,padding:"10px 12px",background:C.surface,borderRadius:8,border:`1px solid ${C.border}`}}>
            <div style={{fontSize:11,color:C.text3,marginBottom:8,textTransform:"uppercase",letterSpacing:".06em"}}>👥 Filleuls ({filleuls.length})</div>
            {filleuls.map(f=>{const nom=[f.first_name,f.last_name].filter(Boolean).join(" ")||f.username||`User #${f.id}`;return<div key={f.id} style={{display:"flex",alignItems:"center",justifyContent:"space-between",padding:"5px 0",borderBottom:`1px solid ${C.border}`,cursor:"pointer"}} onClick={()=>setSelected(f)}>
              <span style={{fontSize:12,color:C.text1}}>{nom}</span>
              <span style={{fontSize:11,color:C.accent}}>{fmt(ca(f.id))}</span>

          {/* Notes internes */}
          <div style={{marginBottom:12}}>
            <div style={{fontSize:11,color:C.text3,marginBottom:6,textTransform:"uppercase",letterSpacing:".06em"}}>📝 Note interne</div>

limit_req_zone $binary_remote_addr zone=api:10m rate=30r/m;
limit_req_zone $binary_remote_addr zone=dashboard:10m rate=60r/m;

server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    client_max_body_size 100m;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://unpkg.com https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://unpkg.com https://cdnjs.cloudflare.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https:; media-src 'self' blob:; connect-src 'self' wss: ws: https:;" always;

    # Public mini app routes (no auth — called by Telegram users)
    location /api/miniapp/ {
        limit_req zone=api burst=20 nodelay;
        proxy_pass http://backend:3001/api/miniapp/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Health check (public)
    location = /health {
        proxy_pass http://backend:3001/health;
        proxy_set_header Host $host;
    }

    # Uploaded files (photos/videos)
    location /uploads/ {
        proxy_pass http://backend:3001/uploads/;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=31536000" always;
    }

    # Admin API
    location /api/ {
        limit_req zone=api burst=10 nodelay;
        proxy_pass http://backend:3001/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # WebSocket
    location /ws {
        proxy_pass http://backend:3001/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Dashboard
    location / {
        limit_req zone=dashboard burst=20 nodelay;
        try_files $uri $uri/ /index.html;
    }
}
